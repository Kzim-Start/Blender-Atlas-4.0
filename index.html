function settingsPage(){return `<div class="section-head"><div><div class="eyebrow">Seu material de estudo</div><h1>Progresso e opções</h1><p>Salve uma cópia do progresso, restaure um backup ou continue estudando de onde parou.</p></div></div><div class="metric-grid"><div class="metric"><strong>${doneCount()}</strong><span>atividades concluídas</span></div><div class="metric"><strong>${totalActivities()}</strong><span>atividades disponíveis</span></div><div class="metric"><strong>${state.favorites.length}</strong><span>modificadores favoritos</span></div><div class="metric"><strong>${Math.round(doneCount()/totalActivities()*100)}%</strong><span>da trilha marcada</span></div></div><div class="two-col"><div class="card"><h3>Gerenciar progresso</h3><p class="tiny">O progresso tenta permanecer no armazenamento local do navegador. Para não perder ao mudar de computador ou navegador, exporte um backup.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn dark" id="exportProgress">Exportar progresso (.json)</button><button class="btn outline" id="importTrigger">Importar backup</button><input type="file" accept="application/json,.json" id="importFile" hidden></div></div><div class="card"><h3>Reiniciar a trilha</h3><p class="tiny">Essa ação desmarca atividades, projetos, favoritos e respostas do teste neste navegador. Não modifica o Blender nem seus arquivos .blend.</p><button class="btn outline" id="resetProgress" style="border-color:#f2c0a8;color:#bd5c32">Zerar tudo</button></div></div><div class="notice" style="margin-top:18px"><strong>Sobre este arquivo HTML</strong>É um material de estudo independente, inspirado no PDF que você enviou. As representações de modificadores são esquemáticas e o comportamento real depende das propriedades, tipo de objeto, modo e versão instalada do Blender. Funciona sem servidor e sem instalar aplicativos adicionais.</div>`}
function updateSearch(){if(state.page==='atalhos'){const q=qs('shortcutSearch')?.value||'';state.search=q;const a=ALLSHORT.filter(s=>(state.filter==='all'||s.area===state.filter)&&(!q||plain(s.action+' '+s.key+' '+s.desc).includes(plain(q))));qs('shortcutResults').innerHTML=makeTable(a)}else if(state.page==='modificadores'){state.modSearch=qs('modifierSearch')?.value||'';let r=modList();qs('modifierResults').innerHTML=r.html;qs('modifierStat').textContent=r.data.length+' modificadores listados'}}
function changeLab(v){state.labAmount=v;let l=labs.find(x=>x.id===state.lab),label=state.lab==='array'?v+' instâncias':(['mirror','subsurf'].includes(state.lab)?(v>0?'Ativo':'Desligado'):v+' / 10');qs('labDrawing').innerHTML=previewSVG(l.id,v);qs('labValue').textContent=label}
function eventAction(el){let d=el.dataset;
 if(d.go){go(d.go);return}
 if(d.shortFilter){state.filter=d.shortFilter;render();return}
 if(d.modFilter){state.modFilter=d.modFilter;render();return}
 if(d.clearSearch){state.search='';render();return}
 if(d.favOnly){state.favOnly=!state.favOnly;render();return}
 if(d.fav){let k=d.fav;state.favorites=state.favorites.includes(k)?state.favorites.filter(x=>x!==k):[...state.favorites,k];save();render();return}
 if(d.completeUnit){let k=d.completeUnit;state.unitsDone=state.unitsDone.includes(k)?state.unitsDone.filter(x=>x!==k):[...state.unitsDone,k];save();render();toast('Progresso atualizado');return}
 if(d.lab){state.lab=d.lab;state.labAmount=state.lab==='array'?6:state.lab==='mirror'||state.lab==='subsurf'?1:4;render();return}
 if(d.openProj){state.openProj=state.openProj===d.openProj?'':d.openProj;render();return}
 if(d.projectReset){state.projectSteps[d.projectReset]={};save();render();return}
 if(d.quiz){let [i,j]=d.quiz.split(':').map(Number);state.quiz[i]=j;save();render();return}
 if(d.resetQuiz){state.quiz={};save();render();return}
 if(el.id==='exportProgress'){const payload=JSON.stringify({version:2,updated:new Date().toISOString(),progress:{unitsDone:state.unitsDone,projectSteps:state.projectSteps,favorites:state.favorites,quiz:state.quiz,tutorialSteps:state.tutorialSteps,materialFaves:state.materialFaves,exportChecks:state.exportChecks}},null,2);const blob=new Blob([payload],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='blender-atlas-progresso.json';document.body.append(link);link.click();setTimeout(()=>URL.revokeObjectURL(link.href),300);link.remove();toast('Backup exportado!');return}
 if(el.id==='importTrigger'){qs('importFile').click();return}
 if(el.id==='resetProgress'){if(confirm('Deseja realmente apagar as marcações locais do Atlas?')){state.unitsDone=[];state.projectSteps={};state.favorites=[];state.quiz={};state.tutorialSteps={};state.materialFaves=[];state.exportChecks={};save();render();toast('Progresso reiniciado')}return}
}
document.addEventListener('click',e=>{let el=e.target.closest('button[data-go],button[data-short-filter],button[data-mod-filter],button[data-fav],button[data-fav-only],button[data-complete-unit],button[data-clear-search],button[data-lab],button[data-open-proj],button[data-project-reset],button[data-quiz],button[data-reset-quiz],#exportProgress,#importTrigger,#resetProgress');if(el)eventAction(el)});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-check-proj]')){const [id,i]=el.dataset.checkProj.split(':');state.projectSteps[id]??={};state.projectSteps[id][i]=el.checked;save();let open=state.openProj;render();state.openProj=open;return}if(el.id==='importFile'&&el.files?.[0]){el.files[0].text().then(s=>{let obj=JSON.parse(s);let p=obj.progress||obj;if(!Array.isArray(p.unitsDone)||!p.projectSteps)throw Error('Formato inválido');state.unitsDone=p.unitsDone;state.projectSteps=p.projectSteps;state.favorites=p.favorites||[];state.quiz=p.quiz||{};state.tutorialSteps=p.tutorialSteps||{};state.materialFaves=p.materialFaves||[];state.exportChecks=p.exportChecks||{};save();render();toast('Backup restaurado!')}).catch(()=>toast('O arquivo não é um backup válido.'))}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='shortcutSearch'||el.id==='modifierSearch'){updateSearch()}if(el.id==='labRange'){changeLab(+el.value)}});
qs('globalSearch').addEventListener('input',e=>{state.search=e.target.value;if(state.search){state.page='busca';render()}else{go('inicio')}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();qs('globalSearch').focus();qs('globalSearch').select()}if(e.key==='Escape')qs('globalSearch').blur()});
qs('mobileMenu').addEventListener('click',()=>{qs('sidebar').classList.toggle('open');qs('overlay').classList.toggle('open')});qs('overlay').addEventListener('click',()=>{qs('sidebar').classList.remove('open');qs('overlay').classList.remove('open')});qs('topHome').addEventListener('click',()=>go('inicio'));
render();
</script>

ossa","detail":"Atribua material Casca grossa; alinhe UV no sentido longitudinal e teste Bump.","key":"U → Unwrap / Shading"},{"title":"Copa","detail":"Monte volumes com icospheres ou folhas planas; use variação sutil de cor.","key":"Shift+A → Icosphere"}],"success":"Silhueta legível e casca correndo verticalmente no tronco.","trap":"Detalhe exagerado na textura não corrige uma silhueta artificial."},{"id":"rocha","title":"Rocha orgânica sem esculpir tudo","level":"Iniciante","area":"Cenários","goal":"Fazer rochas variadas usando poucas operações.","tool":"Proportional Editing + Displace","steps":[{"title":"Forma inicial","detail":"Adicione Icosphere com poucas subdivisões.","key":"Shift+A → Icosphere"},{"title":"Deforme a forma","detail":"Tab → Edit Mode; selecione vértices e mova com O (Proportional Editing).","key":"Tab / O / G"},{"title":"Assimetria","detail":"Altere escala nos eixos e evite uma esfera perfeita.","key":"S X / S Y"},{"title":"Detalhes leves","detail":"Adicione Displace Modifier com textura Noise, Strength baixo.","key":"Modifiers → Displace"},{"title":"Material","detail":"Use pedra bruta e ajuste Roughness; ilumine de lado para testar relevo.","key":"Shading / F12"}],"success":"Cada rocha pode ser variada sem recortes manuais extensos.","trap":"Displace pode deformar demais uma malha sem geometria suficiente."},{"id":"portal","title":"Porta e janela com Boolean","level":"Intermediário","area":"Modelagem","goal":"Abrir recortes geométricos mantendo objetos originais.","tool":"Boolean Difference","steps":[{"title":"Parede","detail":"Crie um cubo achatado para a parede; aplique escala.","key":"S / Ctrl+A"},{"title":"Cortador","detail":"Crie um cubo que atravesse completamente a espessura da parede.","key":"Shift+A / G"},{"title":"Boolean","detail":"Selecione parede → Add Modifier → Boolean → Difference; escolha cortador.","key":"Modifiers → Boolean"},{"title":"Finalize","detail":"Esconda cortador no viewport (sem apagá-lo); observe corte ao mudar tamanho.","key":"H / Outliner"},{"title":"Trate bordas","detail":"Bevel na borda final, após revisar o comportamento da pilha.","key":"Modifier → Bevel"}],"success":"A abertura continua paramétrica até você decidir aplicar.","trap":"Objetos sem interseção ou com normais ruins podem falhar."},{"id":"escultura","title":"Cabeça estilizada por escultura","level":"Intermediário","area":"Escultura","goal":"Trabalhar volumes grandes antes das rugas e poros.","tool":"Voxel Remesh + Grab + Clay Strips","steps":[{"title":"Bloqueio","detail":"Crie uma UV Sphere e ative simetria X no Sculpt Mode.","key":"Shift+A Sphere / Sculpt Mode"},{"title":"Massa principal","detail":"Use Grab e Clay Strips para mandíbula, maçãs do rosto e testa.","key":"Grab / Clay Strips"},{"title":"Remesh","detail":"Use Voxel Remesh para obter densidade mais uniforme; teste Voxel Size coerente.","key":"Sculpt → Remesh"},{"title":"Planos e cortes","detail":"Defina nariz, sobrancelha e cavidades com Clay/Crease, alternando vistas.","key":"Clay / Crease"},{"title":"Revisão","detail":"Suavize apenas o necessário e compare silhueta de perfil.","key":"Smooth / Numpad 3"}],"success":"Cabeça com proporções legíveis sem depender de microdetalhes.","trap":"Voxel size pequeno cedo demais pesa a cena."},{"id":"uv","title":"UV e pintura de caixa de madeira","level":"Intermediário","area":"Pintura","goal":"Abrir UV, carregar imagens e salvar texturas corretamente.","tool":"UV Editing + Texture Paint","steps":[{"title":"Prepare malha","detail":"Selecione modelo e aplique escala; inspecione normals.","key":"Ctrl+A / Shift+N"},{"title":"Costuras","detail":"Edit Mode → Edge select; selecione costuras discretas e Mark Seam.","key":"2 / Ctrl+E → Mark Seam"},{"title":"Unwrap","detail":"Selecione toda malha e faça U → Unwrap; organize ilhas no UV Editor.","key":"A / U → Unwrap"},{"title":"Conecte a imagem","detail":"Material → Image Texture → Base Color. Defina a imagem ativa antes de pintar.","key":"Shader Editor → Shift+A"},{"title":"Pinte e salve","detail":"Texture Paint: pinte e use Image → Save/Save As no Image Editor.","key":"Texture Paint / Image → Save"}],"success":"A textura não deforma visivelmente e não desaparece ao reabrir o .blend.","trap":"Salvar o arquivo .blend nem sempre salva uma imagem externa alterada."},{"id":"rig","title":"Rig básico de personagem","level":"Avançado","area":"Rigging","goal":"Preparar ossos e pesos para uma pose controlável.","tool":"Armature + Parent Automatic Weights","steps":[{"title":"Planeje articulações","detail":"Deixe o personagem com origem e escala corretas, pose simétrica e malha razoável.","key":"Ctrl+A"},{"title":"Crie armature","detail":"Shift+A → Armature; em Edit Mode, extrude ossos a partir do corpo.","key":"Shift+A / Tab / E"},{"title":"Nomeie corretamente","detail":"Use braços/pernas com sufixos .L e .R; confirme orientação dos ossos.","key":"F2"},{"title":"Parent à armature","detail":"Object Mode: selecione mesh, por último armature, Ctrl+P → With Automatic Weights.","key":"Ctrl+P"},{"title":"Teste deformação","detail":"Pose Mode → R para girar os ossos; corrija pesos no Weight Paint.","key":"Pose Mode / R / Weight Paint"}],"success":"Braços e pernas deformam sem colapsos graves nas articulações.","trap":"Pesos automáticos são ponto de partida, não resultado final garantido."},{"id":"andar","title":"Walk cycle em 24 quadros","level":"Avançado","area":"Animação","goal":"Criar ciclo básico com contato, passagem e subida.","tool":"Pose Mode + Keyframes + Graph Editor","steps":[{"title":"Marque poses-chave","detail":"Configure timeline de 1 a 24; frame 1: contato pé esquerdo à frente.","key":"Timeline → 1 / I"},{"title":"Oposto","detail":"Frame 13: contato oposto (direito à frente).","key":"Frame 13 / I"},{"title":"Passagem","detail":"Frames 7 e 19: pernas cruzam na passagem; balanço dos braços oposto às pernas.","key":"Frames 7,19 / I"},{"title":"Feche o ciclo","detail":"No frame 25 copie pose do frame 1 e confira continuidade.","key":"Copy/Paste Pose"},{"title":"Refine curvas","detail":"Graph Editor: verifique foot sliding, espaçamento, aceleração e loop.","key":"Graph Editor"}],"success":"Pés tocam o chão coerentemente e quadros extremos fecham o ciclo.","trap":"Ciclo bom exige atenção à raiz e à trajetória dos pés."},{"id":"render","title":"Render de apresentação do modelo","level":"Intermediário","area":"Render","goal":"Finalizar uma cena demonstrando materiais.","tool":"Camera + Lights + Eevee/Cycles","steps":[{"title":"Câmera","detail":"Adicione câmera; escolha perspectiva de 3/4 e alinhe à vista.","key":"Shift+A Camera / Ctrl+Alt+Numpad0"},{"title":"Luz principal","detail":"Area Light grande à frente/lado; ajuste energia e tamanho para sombras suaves.","key":"Shift+A Light"},{"title":"Luz de preenchimento","detail":"Luz secundária mais fraca do lado oposto, ou HDRI.","key":"World / Area Light"},{"title":"Motor e resolução","detail":"Configure Eevee para prévia ou Cycles para qualidade; render 1080x1080 como exemplo.","key":"Render Properties"},{"title":"Render","detail":"Teste amostras, cor, reflexos e fundo antes do render final.","key":"F12"}],"success":"Materiais legíveis com sombras e reflexos equilibrados.","trap":"Ferro parece escuro se não houver fontes/lugares claros para refletir."},{"id":"exportar","title":"Exportar para Godot ou Unity","level":"Avançado","area":"Exportação","goal":"Entregar modelo com escala, UV, materiais e animações consistentes.","tool":"glTF (.glb)","steps":[{"title":"Organização","detail":"Renomeie objetos, materiais e coleções; remova auxiliares indesejados.","key":"F2 / Outliner"},{"title":"Transformações","detail":"Verifique origem/pivô, medidas, normals, modificadores e escalas.","key":"Ctrl+A / Shift+N"},{"title":"Texturas","detail":"Teste UV, salve mapas e faça Pack Resources quando adequado.","key":"File → External Data"},{"title":"Export GLB","detail":"File → Export → glTF 2.0; escolha GLB e confira objetos/animacoes selecionados.","key":"File → Export → glTF"},{"title":"Teste no destino","detail":"Importe na engine e verifique escala, materiais, rig e animações.","key":"Godot / Unity"}],"success":"Asset importado sem falta de imagens, inversões de malha ou escala absurda.","trap":"Nem todo shader procedural é transportado; bake texturas se necessário."},{"id":"t_barril","title":"Barril com aros metálicos","level":"Iniciante","area":"Modelagem","goal":"Criar barril com forma convexa e detalhes repetidos.","tool":"Extrude + Bevel + Torus","steps":[{"title":"Começar cilindro","detail":"Faça cilindro de 12 lados e escale para o corpo.","key":"Shift + A → Cylinder"},{"title":"Modelar barriga","detail":"Aumente o raio do loop do meio, formando silhueta de barril.","key":"Tab • Alt + clique • S"},{"title":"Fazer o topo","detail":"Faça Inset e pequena extrusão para criar borda superior.","key":"3 • I • E"},{"title":"Adicionar aros","detail":"Crie dois Torus finos e posicione perto das extremidades.","key":"Shift + A → Torus • G"},{"title":"Finalizar","detail":"Aplique madeira e ferro, confira escala e renderize.","key":"Shading • F12"}],"success":"O barril tem barriga suave e pelo menos dois aros com materiais distintos.","trap":"Se o aro atravessar o barril, diminua seu raio ou afaste da madeira."},{"id":"t_cabana","title":"Cabana low-poly com telhado","level":"Intermediário","area":"Arquitetura","goal":"Montar cabana por peças reutilizáveis.","tool":"Mirror + Array + Boolean","steps":[{"title":"Blockout","detail":"Faça cubo principal de parede, ajustando dimensões aproximadas.","key":"Shift + A • S"},{"title":"Telhado","detail":"Use duas faces inclinadas simétricas.","key":"Tab • E • Mirror"},{"title":"Porta","detail":"Corte abertura com Boolean Difference e cubo cortador.","key":"Add Boolean Modifier"},{"title":"Telhas","detail":"Crie uma tábua/telha e repita ao longo da água.","key":"Add Array Modifier"},{"title":"Cena final","detail":"Aplique materiais e teste vista isométrica.","key":"Shading • Numpad 0"}],"success":"Cabana possui entrada, duas águas de telhado e peças identificáveis.","trap":"Boolean em objeto sem espessura pode dar abertura defeituosa."},{"id":"t_pedra","title":"Pedra com musgo procedural","level":"Intermediário","area":"Shading","goal":"Aprender Noise, ColorRamp e Bump em rocha estilizada.","tool":"Noise + ColorRamp + Bump","steps":[{"title":"Forma base","detail":"Deforme cubo com alguns vértices deslocados.","key":"Tab • 1 • G"},{"title":"Sombras de pedra","detail":"Crie material com duas cores de cinza em ColorRamp.","key":"Shading → ColorRamp"},{"title":"Adicionar Noise","detail":"Ligue Noise Texture ao ColorRamp para variar a cor.","key":"Noise Texture → Fac"},{"title":"Bump suave","detail":"Conecte ruído atenuado ao Bump, depois ao Normal.","key":"Bump → Normal"},{"title":"Musgo","detail":"Misture verde irregular na parte superior da rocha com máscara.","key":"Mix Color • Geometry"}],"success":"Pedra tem volume legível e musgo apenas em regiões selecionadas.","trap":"Não exagere na força do Bump."},{"id":"t_lanterna","title":"Lanterna com luz interna","level":"Intermediário","area":"Materiais e iluminação","goal":"Criar luz emissiva e objeto envidraçado para cena noturna.","tool":"Torus + Solidify + Emission","steps":[{"title":"Armação","detail":"Monte base e topo com dois cilindros pequenos.","key":"Shift + A → Cylinder"},{"title":"Hastes","detail":"Faça uma haste e distribua quatro cópias ao redor do centro.","key":"Shift + D • R"},{"title":"Vidro","detail":"Crie faces translúcidas entre as hastes, com espessura se necessário.","key":"Solidify Modifier"},{"title":"Luz","detail":"Use um objeto emissivo e uma Point Light pequena no interior.","key":"Shading • Point Light"},{"title":"Render noturno","detail":"Coloque fundo escuro e confira se a lanterna ilumina objetos próximos.","key":"F12"}],"success":"A lanterna parece acesa e as barras metálicas têm contornos nítidos.","trap":"Emission sozinho pode não iluminar a cena como uma lâmpada."},{"id":"t_escudo","title":"Escudo de madeira simétrico","level":"Iniciante","area":"Modelagem","goal":"Criar forma simétrica sem modelar lados separadamente.","tool":"Mirror + Solidify + Bevel","steps":[{"title":"Meia silhueta","detail":"Comece com um plano e modele metade do contorno.","key":"Shift + A → Plane • Tab"},{"title":"Mirror","detail":"Adicione Mirror e ative Clipping.","key":"Add Mirror Modifier"},{"title":"Espessura","detail":"Solidify na base e Bevel de bordas pequenas.","key":"Add Solidify / Bevel"},{"title":"Detalhes","detail":"Acrescente um emblema frontal com Curve e dois rebites.","key":"Shift + A → Curve"},{"title":"Acabamento","detail":"Aplique madeira com direção UV e metal na borda.","key":"U • Shading"}],"success":"Escudo não tem fenda central e o contorno mantém simetria.","trap":"A origem do Mirror deve estar no eixo central."},{"id":"t_retopo","title":"Retopologia de cabeça esculpida","level":"Avançado","area":"Topologia","goal":"Reconstruir malha leve sobre escultura pesada.","tool":"Mirror + Shrinkwrap","steps":[{"title":"Duplicar segurança","detail":"Mantenha high-poly original e crie coleção separada.","key":"Shift + D • M"},{"title":"Base low-poly","detail":"Faça uma malha simples cobrindo nariz, olhos e boca.","key":"Shift + A • Tab"},{"title":"Simetria","detail":"Utilize Mirror com Clipping no eixo central.","key":"Add Mirror Modifier"},{"title":"Aderência","detail":"Configure Shrinkwrap para aproximar low da escultura.","key":"Add Shrinkwrap Modifier"},{"title":"Validar loops","detail":"Confira edge loops em olhos e boca e teste UV checker.","key":"Alt + clique • U"}],"success":"Malha low-poly segue volume com loops coerentes em regiões móveis.","trap":"Decimate sozinho não cria topologia boa para deformação."},{"id":"t_walk","title":"Walk cycle com contatos alternados","level":"Avançado","area":"Animação","goal":"Animar um personagem já rigado caminhando.","tool":"Pose Mode + Dope Sheet + Graph Editor","steps":[{"title":"Pose inicial","detail":"Frame 1: pé esquerdo à frente e braço direito à frente.","key":"Pose Mode • I"},{"title":"Pose oposta","detail":"Frame 13: espelhe contato de pernas e braços.","key":"Frame 13 • I"},{"title":"Passagens","detail":"Frames 7 e 19: crie poses de passagem e altere quadril.","key":"Dope Sheet • I"},{"title":"Fechar ciclo","detail":"Frame 25: repita frame 1; playback entre 1 e 24.","key":"Shift + D"},{"title":"Ajustar curvas","detail":"Elimine trancos e revise pé plantado no contato.","key":"Graph Editor • T"}],"success":"O personagem alterna pés e não apresenta grandes saltos entre ciclos.","trap":"Rig e pesos precisam estar testados antes da animação."},{"id":"t_estudio","title":"Cena de apresentação para portfólio","level":"Iniciante","area":"Renderização","goal":"Montar estúdio simples para mostrar um asset bem acabado.","tool":"Camera + Area Lights + Render","steps":[{"title":"Selecionar asset","detail":"Centralize o objeto e ajuste escala de cena.","key":"Numpad ."},{"title":"Fundo","detail":"Crie plano amplo e material neutro.","key":"Shift + A → Plane"},{"title":"Câmera","detail":"Posicione câmera em três-quartos e alinhe visão.","key":"Ctrl + Alt + Numpad 0"},{"title":"Iluminação","detail":"Use duas Area Lights e, opcionalmente, uma luz de recorte.","key":"Shift + A → Light"},{"title":"Render","detail":"Configure resolução e exporte imagem final.","key":"F12 • Image → Save As"}],"success":"Imagem mostra silhueta e materiais sem fundo distraindo.","trap":"Cheque exposição antes de aumentar amostras de render."}],"tasks":[{"goal":"Fazer muitas peças repetidas","tool":"Array","steps":"Modele apenas a primeira peça, ajuste Count e Offset no Array.","example":"Repetição de cerca / degraus","tut":"cerca"},{"goal":"Criar objeto perfeitamente simétrico","tool":"Mirror","steps":"Deixe uma metade da mesh e ative Merge/Clipping no Mirror.","example":"Armas e personagens","tut":"espada"},{"goal":"Fazer buracos, janelas e cortes","tool":"Boolean Difference","steps":"Use malha cortadora cruzando o objeto e Boolean Difference.","example":"Porta / encaixe","tut":"portal"},{"goal":"Arredondar borda dura","tool":"Bevel","steps":"Use Ctrl+B em Edit Mode ou Bevel Modifier para manter ajustável.","example":"Móveis / lâminas","tut":"bau"},{"goal":"Deixar superfície mais lisa","tool":"Subdivision Surface","steps":"Subdivide + loops de suporte para preservar cantos.","example":"Personagem / hard surface","tut":"espada"},{"goal":"Adicionar espessura a plano","tool":"Solidify","steps":"Use Solidify no plano ou malha fina, configure Thickness.","example":"Capa / placa / folha","tut":"bau"},{"goal":"Deformar sem esculpir todo vértice","tool":"Proportional Editing","steps":"Ative O, mova um ponto, use roda do mouse para alterar raio.","example":"Pedras orgânicas","tut":"rocha"},{"goal":"Esculpir muito rápido","tool":"Voxel Remesh","steps":"Blocagem por volumes, Remesh com resolução suficiente, depois detalhe.","example":"Personagem","tut":"escultura"},{"goal":"Pintar textura sem perder trabalho","tool":"Texture Paint + Save Image","steps":"Crie e conecte Image Texture ativa; salve a imagem no editor.","example":"Pintura","tut":"uv"},{"goal":"Textura parece borrada ou esticada","tool":"UV Unwrap","steps":"Marque seams, unwrap e confira densidade/escala das ilhas.","example":"Materiais","tut":"uv"},{"goal":"Criar madeira com veios","tool":"Wave + Noise + ColorRamp","steps":"Misture Noise de escala ampla e Wave longitudinal; Normal/Bump suave.","example":"Shader madeira","tut":"bau"},{"goal":"Criar ferrugem localizada","tool":"Noise → Mask → Mix","steps":"Misture metal (Metallic=1) e óxido (Metallic=0).","example":"Shader metal","tut":"espada"},{"goal":"Repetir padrões aleatórios em grande área","tool":"Geometry Nodes","steps":"Distribua pontos, instancie objetos e randomize transformações.","example":"Floresta/cidade","tut":"arvore"},{"goal":"Fazer personagem se mover","tool":"Armature + Weight Paint","steps":"Modele, crie ossos, parent por pesos automáticos e corrija deformações.","example":"Rigging","tut":"rig"},{"goal":"Animar objeto em dois momentos","tool":"Keyframe","steps":"No frame inicial grave propriedade; avance tempo, altere e insira nova chave.","example":"Movimento","tut":"andar"},{"goal":"Animação parece robótica","tool":"Graph Editor","steps":"Ajuste interpolação, handles e espaçamento dos keyframes.","example":"Animação","tut":"andar"},{"goal":"Objeto aparece preto ou sem brilho","tool":"Luzes/HDRI + normals","steps":"Cheque Material Preview/Rendered, World e normais; metal exige algo para refletir.","example":"Shading","tut":"render"},{"goal":"Modelo muito pesado","tool":"Decimate / retopologia","steps":"Avalie geometria, reduza densidade e produza malha otimizada.","example":"Games","tut":"exportar"},{"goal":"Exportar personagem animado","tool":"glTF 2.0 (.glb)","steps":"Cheque armature, animations, transforms e faça teste real na engine.","example":"Pipeline","tut":"exportar"}],"diagnostics":[{"problem":"Boolean não funciona","cause":"Cortador não atravessa, mesh aberta, normais inconsistentes ou escala complicada.","fix":"Confira interseção; use Ctrl+A → Scale; Shift+N; experimente solver e malha limpa."},{"problem":"Mirror deixa fenda no meio","cause":"Origem fora do eixo ou vértices centrais sem Merge/Clipping.","fix":"Traga centro ao eixo, use Merge e Clipping, inspecione vértices na costura."},{"problem":"Bevel fica estranho","cause":"Escala não aplicada, arestas sobrepostas ou valor maior que espaço disponível.","fix":"Ctrl+A → Scale; reduza Width/Amount; cheque Clamp Overlap."},{"problem":"Subdivision arredonda o que não devia","cause":"Loops de suporte ausentes ou malha irregular.","fix":"Insira Loop Cuts perto dos cantos; avalie creases e topologia."},{"problem":"Textura está gigante / minúscula","cause":"Escala UV inconsistente ou Mapping incorreto.","fix":"Ajuste UV e Texture Coordinate → Mapping. Meça o tamanho real do padrão."},{"problem":"Textura fica rosa","cause":"Imagem externa não encontrada.","fix":"Image → Reload/Replace; File → External Data → Pack Resources e salve .blend."},{"problem":"Normal Map fica invertido/estranho","cause":"Normal tratado como cor ou convenção do eixo Y incorreta.","fix":"Image Texture → Non-Color; conecte via Normal Map; confira OpenGL vs DirectX."},{"problem":"Pintei, mas sumiu","cause":"A imagem editada não foi salva ou não era a textura ativa.","fix":"No Image Editor: Image → Save / Save As; reconfirme Image Texture ativa."},{"problem":"O ferro parece plástico","cause":"Metallic/Roughness incorretos, reflexos fracos ou poucas luzes.","fix":"Metallic 1 no ferro limpo; Roughness adequada; use HDRI/Area Lights."},{"problem":"Ferro enferrujado parece cobre","cause":"Ferrugem está tratada como metal refletivo puro.","fix":"Crie máscara metálica: ferro 1, ferrugem 0; altere roughness e altura."},{"problem":"Escultura ficou pesada","cause":"Voxel size excessivamente pequeno ou subdivisões demais.","fix":"Use blocagem baixa; detalhe só depois e retopologia ao finalizar."},{"problem":"Armature não deforma bem","cause":"Weights incorretos ou hierarquia óssea falha.","fix":"Confira parent da malha, weight groups, bone names e transições de articulação."},{"problem":"Modelo exportou gigante/pequeno","cause":"Unidades/escala aplicadas diferentes na engine.","fix":"Aplique transformações, documente escala, teste um cubo de 1 m."},{"problem":"GLB perdeu material procedural","cause":"Shaders exclusivos do Blender não exportam 1:1 para glTF.","fix":"Faça bake em Base Color/Metallic/Roughness/Normal; teste importação."},{"problem":"Render granulado","cause":"Poucas samples ou iluminação complexa.","fix":"Aumente samples de Cycles e ative denoising com cuidado."},{"problem":"Textura apresenta emendas","cause":"Imagem não é tileable ou UV cruzou costura.","fix":"Prefira textura seamless ou faça correções da imagem/UV."}],"glossary":[{"term":"Topologia","desc":"Organização de vértices, arestas e faces que sustenta a forma e deformação."},{"term":"Mesh","desc":"Malha de polígonos do objeto."},{"term":"Vértice","desc":"Ponto 3D que define a geometria."},{"term":"Aresta","desc":"Conexão entre dois vértices."},{"term":"Face","desc":"Superfície formada por arestas."},{"term":"Quad","desc":"Face de quatro lados."},{"term":"N-gon","desc":"Face com mais de quatro lados; pode gerar triangulação imprevisível."},{"term":"Normals","desc":"Vetores que descrevem a orientação da superfície para sombreamento."},{"term":"Edit Mode","desc":"Modo para editar geometria do objeto."},{"term":"Object Mode","desc":"Modo para transformar objetos inteiros."},{"term":"UV","desc":"Coordenadas 2D da superfície para mapear imagens."},{"term":"Seam","desc":"Costura que orienta a abertura UV."},{"term":"Unwrap","desc":"Processo de abrir malha 3D num mapa 2D."},{"term":"Texel Density","desc":"Quantos pixels de textura representam uma unidade de superfície."},{"term":"PBR","desc":"Physically Based Rendering, conjunto de mapas e parâmetros para materiais plausíveis."},{"term":"Base Color","desc":"Mapa de cor/albedo, sem sombras embutidas em um fluxo PBR ideal."},{"term":"Roughness","desc":"Microaspereza; valores altos espalham reflexos."},{"term":"Metallic","desc":"Máscara que distingue metal nu de dielétricos."},{"term":"Normal Map","desc":"Mapa que altera orientação de microdetalhes sem modificar silhueta."},{"term":"Height Map","desc":"Mapa de altura em escala de cinza para bump/deslocamento."},{"term":"Bump","desc":"Simulação de relevo através da normal, sem geometria real."},{"term":"Displacement","desc":"Deslocamento real ou aparente dependente de render e configuração."},{"term":"Ambient Occlusion","desc":"Sombreamento de contato/oclusão local; use com parcimônia."},{"term":"BSDF","desc":"Função de distribuição de espalhamento da luz na superfície."},{"term":"Principled BSDF","desc":"Shader generalista PBR do Blender."},{"term":"Shader Editor","desc":"Editor de nós de material."},{"term":"ColorRamp","desc":"Converte valores em paleta ou máscara de cores."},{"term":"Mix","desc":"Combina cores ou shaders conforme fator."},{"term":"Noise Texture","desc":"Textura procedural de ruído orgânico."},{"term":"Voronoi","desc":"Padrões de regiões/células úteis para pedra, rachaduras, pele."},{"term":"Wave Texture","desc":"Ondas e faixas úteis para veios, linhas e tramas."},{"term":"Geometry Nodes","desc":"Sistema procedural baseado em nós que opera geometria."},{"term":"Modifier Stack","desc":"Sequência de modificadores calculados de cima para baixo."},{"term":"Retopologia","desc":"Reconstrução de malha mais leve e deformável."},{"term":"Voxel Remesh","desc":"Reconstrução volumétrica com voxels, útil em escultura."},{"term":"Armature","desc":"Estrutura de ossos para pose/deformação."},{"term":"Rigging","desc":"Preparação de controles/ossos para animação."},{"term":"Weight Paint","desc":"Pintura da influência dos ossos sobre os vértices."},{"term":"Keyframe","desc":"Registro de valor em momento específico da timeline."},{"term":"Dope Sheet","desc":"Editor para organizar e mover chaves de animação."},{"term":"Graph Editor","desc":"Editor de F-Curves e interpolação."},{"term":"F-Curve","desc":"Curva de animação que descreve a variação de uma propriedade."},{"term":"Eevee","desc":"Motor de render em tempo real."},{"term":"Cycles","desc":"Motor de render por path tracing."},{"term":"HDRI","desc":"Imagem de ambiente de alta faixa dinâmica usada para iluminação/reflexos."},{"term":"GLB","desc":"Formato binário glTF que pode reunir geometria, materiais PBR e animação."},{"term":"Baking","desc":"Conversão de resultados de shader/iluminação em mapas de textura."}],"brushes":[{"name":"Draw","action":"Acrescentar/subtrair volume geral","use":"Estrutura de formas simples"},{"name":"Clay Strips","action":"Construir planos de argila","use":"Rosto, músculos, rochas"},{"name":"Grab","action":"Empurrar e puxar volumes","use":"Silhueta e proporção"},{"name":"Smooth","action":"Suavizar ruído local","use":"Limpeza sem destruir planos"},{"name":"Crease","action":"Criar dobras e sulcos","use":"Lábios, fendas, pedras"},{"name":"Inflate","action":"Inflar volumes","use":"Dedos, tecidos, áreas orgânicas"},{"name":"Scrape/Flatten","action":"Planificar partes da superfície","use":"Rochas, peças duras"},{"name":"Snake Hook","action":"Puxar prolongamentos","use":"Chifres, tentáculos"},{"name":"Mask","action":"Proteger regiões","use":"Editar partes isoladas"},{"name":"Pose","action":"Dobrar regiões grandes","use":"Bloqueio de posição"},{"name":"Paint","action":"Aplicar pigmento/cor","use":"Texture Paint com imagem ativa"},{"name":"Smear","action":"Arrastar cor na superfície","use":"Mistura de transições"},{"name":"Clone","action":"Copiar cor de outra região","use":"Correções de textura"},{"name":"Blur","action":"Misturar pintura","use":"Suavizar manchas"},{"name":"Weight Draw","action":"Editar influência de ossos","use":"Rigging/Weight Paint"}],"recipes":[],"sources":[]}</script>

doneCount=function(){return a3OldCount()+a3Count()};totalActivities=function(){return a3OldTotal()+A3TUT.reduce((a,x)=>a+x.steps.length,0)+11};
nav=function(){a3OldNav();qs('navMain').insertAdjacentHTML('beforeend',`<div class="side-title-new">ATLAS 4.0 • NOVOS RECURSOS</div>`+A3MENU.map(([id,ic,title])=>`<button class="nav-item ${state.page===id?'active':''}" data-go="${id}"><span class="num">${ic}</span>${title}</button>`).join(''))};
home=function(){return a3OldHome()+`<section style="margin-top:30px"><div class="section-head"><div><div class="eyebrow">ATLAS 4.0 • FERRAMENTAS DE ESTUDO</div><h2>Aprenda fazendo, não só decorando</h2><p>Soluções para dificuldades reais, tutoriais guiados, visualizador de geometria e animação.</p></div></div><div class="at3-grid">${[['tarefas','Como faço isso?','Escolha uma dificuldade e descubra uma técnica mais rápida.'],['tutoriais','20 tutoriais guiados','Construa objetos e acompanhe cada etapa.'],['visualizador','Visualizador 3D offline','Gire e examine formas geométricas.'],['animacao-lab','Laboratório de animação','Explore keyframes e interpolação.'],['pinceis','Pincéis e pintura','Entenda o uso dos pincéis e as ferramentas do Blender.'],['diagnostico','Resolver erros','Soluções para problemas de modelagem, UV e rigging.']].map(([p,t,d])=>`<div class="at3-card"><div class="at3-card-body"><div class="meta">RECURSO INTERATIVO</div><h3>${t}</h3><p>${d}</p><button class="btn orange small" data-go="${p}">Explorar →</button></div></div>`).join('')}</div></section>`};

function a3Viewer(){return a3Header('LABORATÓRIO / FORMAS 3D','Visualizador de geometria offline','Gire o objeto com o mouse ou toque, use a roda para aproximar. Demonstração simplificada de silhuetas, sem catálogo de texturas.','Giro e zoom|4 geometrias|Offline')+`<div class="at3-grid two"><div class="card"><div class="at3-viz"><canvas id="a3canvas" width="900" height="600" aria-label="Modelo geométrico 3D rotacionável"></canvas><div class="caption">Arraste para girar • roda para zoom • toque suportado.</div></div></div><div class="card"><h3>Configurações da geometria</h3><label>Forma do objeto</label><select id="a3model" class="input" style="width:100%;margin:9px 0 18px"><option value="box" ${state.obj3d==='box'?'selected':''}>Caixa / Baú</option><option value="pillar" ${state.obj3d==='pillar'?'selected':''}>Coluna / Tronco</option><option value="rock" ${state.obj3d==='rock'?'selected':''}>Rocha</option><option value="blade" ${state.obj3d==='blade'?'selected':''}>Espada</option></select><p>Compare a silhueta de cada forma e o efeito do ângulo da câmera. Esta é uma representação didática, não a Viewport do Blender.</p><button class="btn orange small" data-vreset="1">Centralizar visualizador</button></div></div>`}
function a3InitViewer(){const cvs=qs('a3canvas');if(!cvs)return;const ctx=cvs.getContext('2d');let down=false,px=0,py=0;const geo={box:[[-1,-.85,-.75],[1,-.85,-.75],[1,.85,-.75],[-1,.85,-.75],[-1,-.85,.75],[1,-.85,.75],[1,.85,.75],[-1,.85,.75]],pillar:[],rock:[],blade:[]};let facesCube=[[0,1,2,3],[4,7,6,5],[0,4,5,1],[3,2,6,7],[0,3,7,4],[1,5,6,2]];
 const build=(kind)=>{if(kind==='box')return {v:geo.box,f:facesCube};if(kind==='blade')return {v:[[-.32,-1.8,-.12],[.32,-1.8,-.12],[.22,.45,-.10],[0,2,-.10],[-.22,.45,-.10],[-.32,-1.8,.12],[.32,-1.8,.12],[.22,.45,.10],[0,2,.10],[-.22,.45,.10],[-1,-1.9,-.20],[1,-1.9,-.20],[-1,-1.9,.20],[1,-1.9,.20],[-.12,-2.8,-.11],[.12,-2.8,-.11],[-.12,-2.8,.11],[.12,-2.8,.11]],f:[[0,1,2,3,4],[5,9,8,7,6],[0,4,9,5],[1,6,7,2],[3,8,9,4],[10,11,13,12],[14,15,17,16],[10,14,16,12],[11,13,17,15]]};let sides=kind==='rock'?9:12;let verts=[],faces=[];const levels=kind==='rock'?[[-1.1,.64],[0,1.04],[1,.75]]:[[-1.5,.72],[1.5,.67]];levels.forEach(([z,r],j)=>{for(let i=0;i<sides;i++){let a=i*2*Math.PI/sides;let wobble=kind==='rock'?(1+.13*Math.sin(i*2.7+j*3)) : 1;verts.push([Math.cos(a)*r*wobble,Math.sin(a)*r*wobble,z+(kind==='rock'?.09*Math.cos(i*2.2+j):0)])}});for(let j=0;j<levels.length-1;j++)for(let i=0;i<sides;i++){let nx=(i+1)%sides;faces.push([j*sides+i,j*sides+nx,(j+1)*sides+nx,(j+1)*sides+i])}faces.push(Array.from({length:sides},(_,i)=>i).reverse());faces.push(Array.from({length:sides},(_,i)=>(levels.length-1)*sides+i));return {v:verts,f:faces}};
 const draw=()=>{const W=cvs.width,H=cvs.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d2942';ctx.fillRect(0,0,W,H);ctx.lineWidth=1;ctx.strokeStyle='#34546b';for(let i=0;i<=W;i+=50){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke()}for(let i=0;i<=H;i+=50){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke()}
 let mesh=build(state.obj3d),yaw=state.viewYaw,pitch=state.viewPitch,zoom=state.viewZoom,scale=state.obj3d==='blade'?95:145;let c=Math.cos(yaw),s=Math.sin(yaw),cx=Math.cos(pitch),sx=Math.sin(pitch);let vv=mesh.v.map(([x,y,z])=>{let X=x*c-y*s,Y=x*s+y*c;let Z=z*cx-Y*sx;let Y2=z*sx+Y*cx;return {x:W/2+X*scale*zoom,y:H/2-Z*scale*zoom,depth:Y2,x3:X,y3:Y2,z3:Z}});let polys=mesh.f.map(f=>{let avg=f.reduce((a,i)=>a+vv[i].depth,0)/f.length;let a=vv[f[0]],b=vv[f[1]],d=vv[f[2]],u=[b.x3-a.x3,b.y3-a.y3,b.z3-a.z3],v=[d.x3-a.x3,d.y3-a.y3,d.z3-a.z3],n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],len=Math.hypot(...n)||1;let diff=Math.max(.19,Math.min(.95,Math.abs((n[0]*-.36+n[1]*.56+n[2]*.75)/len)*.74+.18));return {f,avg,diff}}).sort((a,b)=>a.avg-b.avg);
 const rgb=[58,151,199];polys.forEach(({f,diff})=>{ctx.beginPath();f.forEach((i,j)=>j?ctx.lineTo(vv[i].x,vv[i].y):ctx.moveTo(vv[i].x,vv[i].y));ctx.closePath();ctx.fillStyle=`rgb(${rgb.map(x=>Math.round(x*(.45+diff*.84))).join(',')})`;ctx.fill();ctx.strokeStyle='#c1d5e65a';ctx.lineWidth=2;ctx.stroke();});ctx.fillStyle='#c8e4f6';ctx.font='17px sans-serif';ctx.fillText('BLENDER ATLAS • VISÃO DIDÁTICA',24,32)};
 
 cvs.onpointerdown=e=>{down=true;px=e.clientX;py=e.clientY;cvs.setPointerCapture(e.pointerId)};cvs.onpointerup=()=>down=false;cvs.onpointercancel=()=>down=false;cvs.onpointermove=e=>{if(!down)return;state.viewYaw+=(e.clientX-px)*.008;state.viewPitch=Math.max(-1.42,Math.min(1.42,state.viewPitch+(e.clientY-py)*.008));px=e.clientX;py=e.clientY;draw()};cvs.onwheel=e=>{e.preventDefault();state.viewZoom=Math.max(.48,Math.min(2.1,state.viewZoom*(e.deltaY>0?.92:1.09)));draw()};draw();a3InitViewer._draw=draw;}
function a3Anim(){return a3Header('ANIMAÇÃO / F-CURVES','Laboratório de keyframes','Compare velocidade linear e suave entre dois keyframes. Depois faça o equivalente no Graph Editor do Blender.','Frame 1–25|Interpolação|Quadros de animação')+`<div class="card"><h2>Movimento entre poses</h2><div class="at3-animsim"><div class="at3-animball" id="a3AnimBall"></div></div><div class="at3-anim-row"><label>Frame <b id="a3FrameLabel">1</b> / 25</label><input id="a3Frame" type="range" min="1" max="25" value="${state.animFrame}"><button class="btn orange small" data-anim-play="1">▶ Reproduzir</button><button class="btn outline small" data-anim-stop="1">■ Parar</button></div><div class="at3-chips" style="margin-top:14px"><button data-ease="linear" class="${state.animEase==='linear'?'active':''}">Linear: velocidade constante</button><button data-ease="smooth" class="${state.animEase==='smooth'?'active':''}">Bezier simplificado: suave</button></div><p style="margin:18px 0 0"><b>No Blender:</b> insira keyframes nos frames 1 e 25; no Graph Editor mude a interpolação entre Linear e Bezier. O movimento acima é uma simplificação para comparar a aceleração, não reproduz todos os handles de curvas.</p></div><div class="at3-grid two" style="margin-top:20px"><div class="card"><h3>Dope Sheet</h3><p>Arraste e reorganize as chaves para mudar tempo e ritmo das ações.</p></div><div class="card"><h3>Graph Editor</h3><p>Refine as F-Curves para controlar aceleração, amortecimento e paradas naturais.</p></div></div>`}
let a3AnimTimer=null;function a3SetFrame(v){state.animFrame=Math.min(25,Math.max(1,+v));let ball=qs('a3AnimBall'),label=qs('a3FrameLabel'),slider=qs('a3Frame');if(!ball)return;let t=(state.animFrame-1)/24;let ease=state.animEase==='linear'?t:t*t*(3-2*t);ball.style.left=(8+ease*78)+'%';ball.style.top=(35-Math.sin(ease*Math.PI)*21)+'%';label.textContent=state.animFrame;slider.value=state.animFrame}

const a3Checklist=[['geo','Geometria e escala','Verifique tamanho, origem/pivô, orientation e transformações antes da exportação.'],['norm','Normais','Recalcule normais quando necessário e inspecione faces invertidas.'],['uv','UVs','Confirme UV unwrap sem deformações visíveis e densidade coerente.'],['maps','Mapas PBR','Salve BaseColor, Metallic/Roughness, Normal e demais mapas no formato correto.'],['bake','Bake procedural','Faça bake de shaders não compatíveis com glTF quando necessário.'],['lod','Otimização','Considere polígonos, draw calls e tamanhos de texturas.'],['rig','Rig e pesos','Teste hierarquias, deformação, nome dos ossos e keyframes.'],['anims','Animações','Escolha clips/ciclos necessários e revise primeiro/último frame.'],['naming','Nomes','Renomeie objetos, materiais, ossos e ações de forma consistente.'],['glb','Exportar GLB','File → Export → glTF 2.0; configure seleção e animações conforme engine.'],['test','Validar na engine','Importe de verdade e cheque escala, shaders, ossos, movimentos e colisões.']];
function a3Export(){let n=a3Checklist.filter(([id])=>state.exportChecks[id]).length;return a3Header('ENTREGA / GAMES','Checklist de exportação','Antes de enviar um asset para Godot ou Unity, faça estas verificações. Marque cada etapa e guarde o progresso localmente.','11 conferências|GLB / glTF|Godot • Unity')+`<div class="card"><div class="section-head"><h2>Meu asset está pronto?</h2><span class="pill">${n}/11 concluídos</span></div><div class="progress-bar" style="margin-bottom:19px"><div class="progress-fill" style="width:${n/11*100}%"></div></div>${a3Checklist.map(([id,title,d])=>`<div class="at3-checkrow"><input id="a3ch_${id}" type="checkbox" data-export-check="${id}" ${state.exportChecks[id]?'checked':''}><label for="a3ch_${id}">${esc(title)}<small>${esc(d)}</small></label></div>`).join('')}<div class="at3-callout"><b>Importante:</b> salve as imagens antes do export, e sempre confira o resultado abrindo na engine. Não basta ver o arquivo GLB no Blender.</div></div>`}
function a3Sources(){return a3Header('RECURSOS / INTERNET OPCIONAL','Onde baixar PBR fotorrealista CC0','O HTML e suas simulações funcionam offline. Estes links exigem internet e oferecem materiais fotográficos de melhor resolução para seus modelos finais. Confira sempre os termos específicos antes do uso.','Poly Haven|ambientCG|cgbookcase')+`<div class="at3-grid two">${ATLAS3.sources.map(x=>`<div class="at3-sources"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer"><strong>↗ ${esc(x.name)}</strong><span>${esc(x.why)}</span></a></div>`).join('')}</div><div class="card" style="margin-top:20px"><h3>Qual resolução baixar?</h3><p><b>1K–2K</b> frequentemente bastam para assets pequenos e protótipos; <b>4K</b> pode ajudar em objetos maiores ou em close-ups; <b>8K</b> tende a consumir bastante VRAM. Escolha conforme distância da câmera, UVs e plataforma.</p><p>Para protótipos, use os mapas procedurais de 256 px do ZIP que acompanha o Atlas. Eles não substituem capturas PBR fotográficas de alta definição.</p><div class="at3-nodes"><span class="at3-node">Base Color (sRGB)</span><span class="at3-arrow">→</span><span class="at3-node">Principled Base Color</span></div><div class="at3-nodes"><span class="at3-node">Normal (Non-Color)</span><span class="at3-arrow">→</span><span class="at3-node">Normal Map</span><span class="at3-arrow">→</span><span class="at3-node">Principled Normal</span></div><div class="at3-nodes"><span class="at3-node">Roughness (Non-Color)</span><span class="at3-arrow">→</span><span class="at3-node">Principled Roughness</span></div></div>`}
const a3OldGlobalResults=globalResults;
globalResults=function(){let q=state.search;if(!q)return a3OldGlobalResults();let tasks=ATLAS3.tasks.filter(x=>plain(x.goal+' '+x.tool).includes(plain(q)));return `<div class="card" style="margin-bottom:20px"><h3>${tasks.length} soluções por tarefa</h3><p>${tasks.slice(0,4).map(x=>esc(x.goal)).join(' • ')||'Nenhuma solução correspondente.'}</p><button data-go="tarefas" class="btn orange small">Explorar soluções →</button></div>`+a3OldGlobalResults()};
// Eventos da nova seção; não substituem os da apostila anterior.
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.matOpen){state.matSelected=d.matOpen;save();render();qs('matDetail')?.scrollIntoView({behavior:'smooth',block:'start'})}
 else if(d.matFav){state.materialFaves=state.materialFaves.includes(d.matFav)?state.materialFaves.filter(x=>x!==d.matFav):[...state.materialFaves,d.matFav];save();render()}
 else if(d.matFavs){state.matFavOnly=!state.matFavOnly;render()}
 else if(d.matJump){state.matSelected=d.matJump;go('materiais');qs('matDetail')?.scrollIntoView({behavior:'smooth',block:'start'})}
 else if(d.tutOpen){state.openTutorial=d.tutOpen;go('tutoriais')}
 else if(d.vreset){state.viewYaw=.53;state.viewPitch=-.35;state.viewZoom=1;a3InitViewer._draw?.()}
 else if(d.animPlay){clearInterval(a3AnimTimer);a3AnimTimer=setInterval(()=>{if(state.page!=='animacao-lab'){clearInterval(a3AnimTimer);return}a3SetFrame((state.animFrame||1)%25+1)},75)}
 else if(d.animStop){clearInterval(a3AnimTimer)}
 else if(d.ease){state.animEase=d.ease;save();render()}
});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='matSearch'){state.matSearch=el.value;qs('matResults').innerHTML=a3MatCards()}else if(el.id==='taskQuery'){state.taskQuery=el.value;qs('taskResults').innerHTML=a3TaskCards(ATLAS3.tasks.filter(x=>!state.taskQuery||plain(x.goal+' '+x.tool+' '+x.steps).includes(plain(state.taskQuery))))}else if(el.id==='diagQuery'){state.diagQuery=el.value;qs('diagResults').innerHTML=a3DiagCards()}else if(el.id==='glossQuery'){state.glossQuery=el.value;qs('glossResults').innerHTML=a3GlossCards()}else if(el.id==='brushQuery'){state.brushQuery=el.value;qs('brushResults').innerHTML=a3BrushCards()}else if(el.id==='a3Frame'){clearInterval(a3AnimTimer);a3SetFrame(+el.value)}});
document.addEventListener('change',e=>{let el=e.target;if(el.id==='matFilter'){state.matFilter=el.value;qs('matResults').innerHTML=a3MatCards()}else if(el.id==='a3model'){state.obj3d=el.value;save();a3InitViewer._draw?.()}else if(el.id==='a3viewmat'){state.viewerMat=el.value;save();render()}else if(el.dataset.tutCheck){let [id,idx]=el.dataset.tutCheck.split(':');state.tutorialSteps[id]??={};state.tutorialSteps[id][idx]=el.checked;save();render()}else if(el.dataset.exportCheck){state.exportChecks[el.dataset.exportCheck]=el.checked;save();render()}});
// Identidade visual estendida e progresso v3; revê contadores da barra.
render();
</script>
<script id="atlas4-data" type="application/json">{"lessons":[{"id":"bau","title":"Baú medieval — do cubo ao game asset","stage":"Modelagem + materiais","level":"Iniciante","script":"bau","goal":"Aprenda a construir volume, bordas, peças, ferragens e UVs sem editar dezenas de vértices.","steps":[["Preparar a cena","Exclua os objetos padrão desnecessários. Adicione um cubo e nomeie como Corpo_Bau.","A → X, Shift + A","Organização: nenhum Cube.001 perdido."],["Escala real e Apply","Escalone a caixa para 2,35 × 1,4 × 1,24 m e aplique Scale.","S + X/Y/Z • Ctrl + A → Scale","A escala no painel Item deve ser 1, 1, 1."],["Bordas não destrutivas","Adicione Bevel Modifier (Width 0,03–0,06 m, Segments 3); se necessário Weighted Normal.","F3 → Add Bevel Modifier","Bordas recebem luz sem parecer borracha."],["Tampa independente","Duplique a caixa superior ou crie um segundo cubo achatado. Evite cortar a caixa inteira.","Shift + D • G + Z","Tampa pode ser selecionada separadamente."],["Ferragens por instância","Modele UMA tira metálica, duplique com Alt + D para compartilhar geometria.","Alt + D","Alterar a malha de uma tira altera as vinculadas."],["Rebites automáticos","Modele um rebite, aplique Array Modifier: Count 9, Offset ajustado para a largura da frente.","F3 → Add Array Modifier","Espaçamento regular, sem duplicações manuais."],["UV e materiais","Faça UV Unwrap das tábuas; mantenha a direção do veio. Atribua madeira, ferro e bronze.","Tab → A → U","Madeira não fica esticada nos lados."],["Iluminar, testar e exportar","Use uma Area Light; confira tamanho, UVs e materiais. Exporte glTF 2.0 (.glb) e confira na engine.","F12 • File → Export → glTF 2.0","GLB importado corretamente com materiais compatíveis."]],"pitfall":"Não aplique todos os modificadores cedo: preserve o trabalho não destrutivo."},{"id":"espada","title":"Espada estilizada — simetria e arestas","stage":"Modelagem + hard surface","level":"Iniciante","script":"espada","goal":"Criar uma espada equilibrada e limpa sem deformações ao usar Subdivision.","steps":[["Planeje por silhueta","Comece com lâmina, guarda, punho e pomo como partes separadas.","Shift + A","Silhueta reconhecível mesmo sem texturas."],["Lâmina em Edit Mode","Use extrusões E e escalas S para afinar a ponta da lâmina.","Tab • E • S","Ponta se forma sem muitos cortes extras."],["Simetria de verdade","Use Mirror Modifier no eixo X se a geometria estiver apenas de um lado e centrada na origem.","F3 → Mirror Modifier","A metade refletida acompanha suas edições."],["Guarda e cabo","Crie cubo para a guarda e cilindro para punho; aplique escala antes de Bevel.","Shift + A • Ctrl + A","Separação lógica entre as partes."],["Acabamento de bordas","Bevel pequeno e Weighted Normal quando melhorar o sombreamento; inspecione topo e lateral.","F3 → Bevel Modifier","Sem artefatos pretos nos reflexos."],["Metal e couro","Metálico 1 para lâmina limpa, Roughness inicial 0,22; couro Metallic 0, Roughness inicial 0,76.","Shader Editor","Reflexos condizem com material."],["UV e detalhes","Abra UV no punho, confira tiling; faça desgastes apenas onde a arma tocaria.","U → Unwrap","Danos com direção e lógica, sem ruído aleatório exagerado."],["Teste de asset","Cheque origem/pivô no cabo, escala e orientação de exportação.","Object → Set Origin","Espada segura no ponto correto na engine."]],"pitfall":"Subdivision sobre n-gons ou escala não aplicada pode produzir deformações."},{"id":"cerca","title":"Cerca — Array e repetição sem trabalho repetitivo","stage":"Produtividade","level":"Iniciante","script":"cerca","goal":"Substitua 30 duplicações por uma única geometria com controle paramétrico.","steps":[["Modele uma única estaca","Use um cubo estreito; arredonde bordas com Bevel de poucos segmentos.","Shift + A → Cube","Uma única estaca bem acabada."],["Aplique transformações","Aplique Scale para o espaçamento relativo não gerar surpresa.","Ctrl + A → Scale","Scale = 1 nos três eixos."],["Adicione Array","Escolha Count 12 e Constant Offset X 0,48 (desligue Relative Offset).","F3 → Add Array Modifier","Doze estacas em linha de forma paramétrica."],["Crie travessas","Adicione dois cubos longos atrás das estacas.","Shift + A • G","Travessas não atravessam a frente."],["Curvas opcionais","Para cercas curvas, use Curve e deforme geometria adequada ao percurso; revise ordem do stack.","F3 → Curve Modifier","Repetições seguem o trajeto pretendido."],["Material único","Aplique madeira nas estacas e travessas com UV consistente.","Shader Editor","Mesmo tamanho aparente do veio."],["Converta somente se necessário","Mantenha Array editável até o fim; aplique antes da exportação só se o fluxo exigir.","Modifier → Apply","Nenhuma duplicação manual desnecessária."],["Valide na engine","Confira repetição, escalas e materiais após exportar.","File → Export → glTF 2.0","Comprimento total apropriado."]],"pitfall":"Relative Offset depende das dimensões do objeto; Constant Offset usa distância fixa."},{"id":"arvore","title":"Árvore antiga — tronco, casca e musgo","stage":"Escultura + texturas","level":"Intermediário","script":"arvore","goal":"Diferenciar madeira bruta, casca e madeira descascada com materiais coerentes.","steps":[["Tronco por volumes","Modele tronco e galhos grossos antes dos sulcos; mantenha a silhueta legível.","Shift + A → Cylinder","Volumes legíveis à distância."],["Galhos principais","Extrude faces superiores ou use curvas com Bevel Depth para galhos orgânicos.","E • Curves","Galhos se unem visualmente ao tronco."],["Sculpt básico","Grab altera silhueta; Clay Strips define massas; Smooth suaviza transições.","Sculpt Mode","Silhueta irregular sem microdetalhes precoces."],["Remesh com critério","Voxel Remesh para esculpir, lembrando que será necessário retopologia para deformação ou jogo.","Sculpt → Remesh","Densidade homogênea no sculpt, não no asset final."],["Madeira descascada","Misture madeira clara e casca escura usando máscara Noise/ColorRamp; máscara não deve ser simplesmente Metallic.","Shader Editor","Áreas expostas mais claras, casca mais rugosa."],["Casca com relevo","Noise + Bump em baixa intensidade, orientado no eixo do tronco; evitar relevo profundo irrealista.","Noise → Bump","Sulcos verticais plausíveis."],["Musgo localizado","Distribua musgo em cantos úmidos/superfícies menos expostas por máscara, não em toda superfície.","Mix Color / Geometry","Musgo acumulado de modo coerente."],["Otimização","Retopo/decimate se adequado, bake das informações e exporte versões low-poly.","Retopo • UV • Bake","Silhueta preservada e polígonos controlados."]],"pitfall":"Displacement real exige geometria subdividida; Normal/Bump alteram aparência, não silhueta."},{"id":"rocha","title":"Rocha — escultir, remesh e preparar para jogo","stage":"Escultura + retopologia","level":"Intermediário","script":"rocha","goal":"Da massa bruta ao detalhe, mantendo eficiência para jogos.","steps":[["Base low-poly","Comece com Icosphere de poucas subdivisões, escala não uniforme.","Shift + A → Icosphere","Evite esfera perfeita."],["Variação superficial","Use Displace Modifier com textura de ruído ou Sculpt, com moderação.","F3 → Displace Modifier","Silhueta irregular, mas legível."],["Escultura de planos","Use Scrape/Flatten, Clay Strips e Crease para rocha quebrada.","Sculpt Mode","Planos grandes definidos."],["Retopologia","Gere low-poly por retopo manual ou Decimate e inspecione o resultado.","Modifier → Decimate","Geometria pequena e utilizável."],["UV","Marque seams em lugares menos visíveis, abra UV e cheque alongamento.","Ctrl + E → Mark Seam • U","UVs sem esticar padrões."],["Baking normal","Faça Bake High → Low com ray distance/cage conferidos.","Render → Bake","Detalhe da high-poly recuperado na low-poly."],["PBR da pedra","BaseColor e Roughness Non-Color corretamente configurados; Metallic = 0.","Shader Editor","Pedra fosca com microdetalhes discretos."],["LOD opcional","Crie variantes adequadas à câmera/plataforma e valide importação.","Decimate / Export","Performance coerente com o projeto."]],"pitfall":"Não confundir resolução de textura com número de polígonos."},{"id":"personagem","title":"Mago low-poly — corpo, hierarquia e texturas","stage":"Personagens","level":"Intermediário","script":"personagem","goal":"Personagem blockout detalhado, preparado para iniciar rigging.","steps":[["Referência e proporção","Crie referências frente/lateral e defina proporções antes de detalhar.","Numpad 1 / 3","Silhueta reconhecível do mago."],["Blockout por primitivas","Torso, pernas, braços, cabeça e chapéu em objetos separados, com nomes claros.","Shift + A","Proporções fáceis de reajustar."],["Espelhe as partes","Mirror Modifier nas partes simétricas, com origem centrada.","F3 → Mirror","Ajustes iguais nos dois lados."],["Controle de topologia","Adicione edge loops em articulações e evite triângulos mal posicionados onde dobra.","Ctrl + R","Articulações com geometria suficiente."],["Sculpt só depois da base","Se desejar detalhes orgânicos, aplique detalhes em cópia para alta resolução.","Sculpt Mode","Base preservada para jogo."],["UV e materiais","Separe tecidos e pele; crie variação de roughness e tinta.","UV Editing • Shader Editor","Personagem coerente sob iluminação."],["Preparar rig","Aplique escalas, centre simetria, arrume origem, remova malhas duplicadas.","Ctrl + A • Outliner","Malha limpa para pesos."],["Exportar blockout","Salve como .blend e só passe à animação após validar proporções.","Ctrl + S","Blockout pronto para o próximo módulo."]],"pitfall":"O script de prática entrega um placeholder, não um personagem rigado e pronto."},{"id":"rig","title":"Rigging — bones, pesos, IK e poses","stage":"Rigging","level":"Intermediário","script":null,"goal":"Criar um esqueleto simples e testar deformação sem prometer um auto-rig mágico.","steps":[["Armature no centro","Em Object Mode, Shift+A → Armature; ative In Front para visualizar ossos.","Shift + A → Armature","Ossos aparecem sobre a malha."],["Ossos em Edit Mode","Selecione bone e extrude tronco/ombros/pernas com E em Edit Mode.","Tab → E","Cabeça e cauda posicionadas na anatomia."],["Nomeação L/R","Use nomes simétricos como upper_arm.L e upper_arm.R para espelhamento de poses.","F2","Ossos nomeados sem ambiguidade."],["Parent malha e armature","Selecione malha, depois armature como ativo; Ctrl + P → With Automatic Weights.","Ctrl + P","Os Vertex Groups são criados."],["Inspecionar pesos","Entre em Weight Paint e verifique influência perto de ombros, cotovelos e quadril.","Weight Paint Mode","Deformação contínua, sem rasgos."],["Testar Pose Mode","Rotacione braços, pernas e cabeça, verificando colisões e estiramento.","Ctrl + Tab / Pose Mode","Movimento previsível."],["IK opcional","Adicione IK constraint nos ossos apropriados e um target; teste direção de dobra/pole target.","Pose → Bone Constraints","IK segue o controlador sem inversões."],["Ação e exportação","Insira keyframes, renomeie Action e teste clips após exportar para glTF.","I (Pose Mode)","Rig e animações funcionam na engine."]],"pitfall":"Pesos automáticos podem falhar ou precisar de pintura manual; o script cria apenas a armature básica."},{"id":"animacao","title":"Animação — bouncing ball, keyframes e F-Curves","stage":"Animação","level":"Iniciante","script":"animacao","goal":"Entender timing, espaçamento, aceleração e curvas de animação.","steps":[["Cena limpa","Adicione UV Sphere e configure Timeline com frames 1–25.","Shift + A","Timeline acessível e objeto nomeado."],["Pose no primeiro frame","Frame 1: mova para X -3, Z 1 e insira keyframe em Location.","I sobre Location","Marcador amarelo na timeline."],["Ápice do pulo","Frame 13: X 0, Z 3; insira o segundo keyframe.","I","Esfera sobe no meio do movimento."],["Finalizar ciclo","Frame 25: X 3, Z 1; insira o último keyframe.","I","Movimento termina no chão."],["F-Curves","No Graph Editor, selecione chaves, altere interpolação entre Linear e Bezier.","T no Graph Editor","A aceleração muda de forma perceptível."],["Handles","Ajuste handles para reduzir ou aumentar aceleração; evite bounce estranho na colisão.","V no Graph Editor","Movimento temporal controlado."],["Dope Sheet","Desloque keyframes para modificar ritmo sem editar geometria.","Dope Sheet","Animação mais rápida ou lenta."],["Preparar Action","Renomeie a ação e confira início/fim do clip; exporte e teste quando necessário.","Action Editor","Animação reaproveitável."]],"pitfall":"O atalho I muda de contexto; confira a área sob o cursor e keymap."},{"id":"barril","title":"Barril rústico — ripas curvas e aros de ferro","stage":"Modelagem hard-surface","level":"Iniciante","script":null,"goal":"Construir um barril com curvatura, ripas repetidas, dois aros e material de madeira sem duplicar cada peça à mão.","steps":[["Desenhar o perfil","Adicione cilindro com 12 ou 16 vértices e altura aproximada de 1,2 m; aplique a escala.","Shift + A → Cylinder • Ctrl + A → Scale","Silhueta geral está proporcional à altura."],["Criar a barriga","Em Edit Mode, crie um loop central com Ctrl + R; selecione-o e aumente ligeiramente o raio com S, mantendo topo/base menores.","Tab • Ctrl + R • Alt + clique • S","Perfil do barril é mais largo no meio."],["Separar tampo","Faça Inset da face superior e rebaixe alguns centímetros usando Extrude.","3 • I • E","Tampo é plano e tem aro perceptível."],["Preparar uma ripa","Duplique uma faixa lateral como peça separada ou modele uma ripa curva sobre o volume de referência.","Shift + D • P → Selection","Uma ripa está isolada e editável."],["Repetir ao redor","Use Spin/Duplicate Around Cursor ou Array com Object Offset por Empty; cheque origem e ângulo 360°/n.","Shift + S • Shift + A → Empty","Ripas formam circunferência sem espaços grandes."],["Colocar aros","Adicione dois Torus com raio adequado, ajuste espessura para não atravessar as ripas.","Shift + A → Torus • S • G","Dois aros de metal envolvem o barril."],["Texturizar","UV das ripas com veio vertical; madeira com Roughness alta e aros metálicos com Metallic=1.","U → Unwrap • Shading","Madeira e ferro são visualmente diferentes."],["Apresentar asset","Organize Collection, crie uma Area Light e renderize uma vista três-quartos.","M • Shift + A → Light • F12","Barril pronto para ser usado como asset modular."]],"pitfall":"Não modele dezenas de ripas antes de acertar a curvatura; revise Normals e a largura do Bevel."},{"id":"cabana","title":"Cabana de madeira — paredes, telhado e janelas","stage":"Arquitetura para jogos","level":"Intermediário","script":null,"goal":"Modelar uma casa medieval pequena com simetria, portas e janelas sem recortar vértice a vértice.","steps":[["Bloquear volumes","Use cubo principal com dimensões aproximadas de 5 × 4 × 3 m; coloque outro bloco como telhado provisório.","Shift + A • S • N","Proporções gerais podem ser lidas de longe."],["Criar paredes","Duplique um cubo achatado para paredes ou use Solidify numa casca com espessura adequada.","Shift + D • Add Solidify Modifier","Parede tem espessura e não é um plano invisível."],["Construir telhado","Crie duas águas com malha dobrada ao centro; use Mirror para manter simetria.","Tab • E • Add Mirror Modifier","Telhado fecha no cume sem sobreposições."],["Abrir porta","Posicione cubo cortador atravessando a parede; use Boolean → Difference.","Add Boolean Modifier","A abertura da porta atravessa a parede."],["Fazer janelas","Reaproveite um cortador de janela; repita com Alt + D onde possível.","Alt + D • G + X","As janelas têm tamanhos consistentes."],["Criar tábuas","Modele uma única tábua no telhado e repita com Array, ajustando espaçamento.","Add Array Modifier","O telhado tem repetição regular sem trabalho manual."],["Materiais e UV","Separe materiais de madeira, pedra e telha; alinhe UV com o sentido das tábuas.","U → Unwrap • Shading","Sem textura esticada nos lados."],["Preparar para jogo","Aplique escala, nomeie elementos, preserve colisões simples e exporte GLB de teste.","Ctrl + A • F2 • File → Export","A cabana aparece corretamente na engine."]],"pitfall":"O Boolean funciona melhor quando os cortadores cruzam a parede e a geometria está coerente."},{"id":"ponte","title":"Ponte de madeira — módulos, apoios e curva","stage":"Modelagem modular","level":"Intermediário","script":null,"goal":"Construir uma ponte com vigas repetidas e ligeira curvatura, aprendendo Array e Curve sem posicionar tábuas uma a uma.","steps":[["Definir percurso","Adicione Curve Bézier e modele o arco suave da ponte no plano lateral.","Shift + A → Curve → Bézier • Tab","Curva cruza o vão e tem inclinação plausível."],["Criar tábua inicial","Modele um cubo com comprimento e largura de tábua; aplique escala.","Shift + A → Cube • S • Ctrl + A","Uma tábua está na orientação do eixo longitudinal."],["Repetir tábuas","Use Array para gerar a sequência; ajuste Count e Offset para não deixar espaços excessivos.","Add Array Modifier","Tábua se repete com distâncias constantes."],["Acompanhar curvatura","Adicione Curve Modifier após Array e escolha a curva criada.","Add Curve Modifier","Piso acompanha o arco da ponte."],["Criar vigas laterais","Use Mirror ou duplicação ligada para ter apoios simétricos.","Add Mirror Modifier • Alt + D","Apoios correspondentes ficam na mesma altura."],["Colocar postes","Crie um poste e use Array para espaçar postes igualmente ao longo da estrutura.","Shift + D • Add Array Modifier","Postes têm padrão repetitivo."],["Adicionar materiais","Madeira bruta nas tábuas e pedra nos suportes; confira a orientação dos veios.","Shading • U","Detalhes continuam legíveis a distância."],["Testar e exportar","Vista lateral e ortográfica; verifique interseções, triangulação e escala para exportação.","Numpad 1/3/7 • File → Export","Ponte pronta para cenário modular."]],"pitfall":"Array e Curve são sensíveis à origem e ao eixo de deformação; alinhe a orientação antes."},{"id":"lanterna","title":"Lanterna medieval — metal, vidro e emissão","stage":"Hard-surface + shader","level":"Intermediário","script":null,"goal":"Criar lanterna estilizada com estrutura de metal, painéis e material emissivo sem excesso de geometria.","steps":[["Silhueta inicial","Construa base e topo com dois cilindros pequenos e um volume central como referência.","Shift + A → Cylinder • S","Silhueta de lanterna legível."],["Fazer estrutura","Modele uma haste e repita quatro vezes por rotação usando duplicações em torno do cursor.","Shift + D • R + Z","Quatro cantos simétricos e sem interseções."],["Abrir painéis","Crie uma face por painel; Solidify dá espessura ao metal e ao vidro quando necessário.","Add Solidify Modifier","Vidro e armação ocupam volumes separados."],["Detalhar topo","Use Inset e Extrude para criar uma cobertura pequena e uma alça.","I • E • Ctrl + B","Topo possui detalhes visíveis."],["Criar vidro","Material transparente com Transmission; ajuste Roughness para vidro limpo ou sujo.","Shading → Principled BSDF","Reflexos aparecem sem virar espelho opaco."],["Criar fonte de luz","Adicione pequeno objeto interno com material emissivo; Area/Point Light ilumina o entorno.","Shift + A → Light → Point","Objeto parece aceso e ilumina a cena."],["Polir bordas","Aplique Bevel estreito ao metal, evitando arestas de lâmina.","Add Bevel Modifier","A luz destaca contornos sem aparência de plástico."],["Render final","Use fundo escuro, exposição controlada e render de dia/noite.","F12 • Render Properties","A lanterna se lê claramente nos dois ambientes."]],"pitfall":"Emission não substitui necessariamente a iluminação real; confira o render e o motor escolhido."},{"id":"escudo","title":"Escudo de madeira — simetria e emblema","stage":"Modelagem + UV","level":"Iniciante","script":null,"goal":"Construir escudo com forma simétrica, espessura, borda metálica e símbolo central.","steps":[["Definir formato","Crie plano com 6 a 8 vértices para meia silhueta do escudo.","Shift + A → Plane • Tab","Contorno de metade do escudo faz sentido."],["Espelhar","Adicione Mirror no eixo central com Clipping ativo.","Add Mirror Modifier","Escudo completo sem fenda central."],["Dar profundidade","Ajuste curvatura suave e adicione Solidify para espessura.","G + Y • Add Solidify Modifier","Frente convexa e parte traseira coerente."],["Bordas metálicas","Crie aro a partir do contorno duplicado, separe e use Bevel.","Shift + D • P → Selection • Ctrl + B","Aro acompanha a forma do escudo."],["Fazer parafusos","Modele rebite único, duplique com Alt + D e distribua pelos cantos.","Alt + D","Rebites com tamanho idêntico."],["Criar símbolo","Adicione malha simples ou Curve 2D sobre a frente.","Shift + A → Curve","Símbolo não entra dentro da madeira."],["UV e materiais","Direcione veios da madeira verticalmente; aplique Metallic no aro e Roughness na madeira.","U → Unwrap • Shading","Materiais distintos e sem distorção grave."],["Pronto para exportar","Centralize origem de empunhadura, organize coleção e gere GLB.","Object → Set Origin • File → Export","Pivô e escala funcionam para equipar no personagem."]],"pitfall":"Mirror exige origem centrada; aplique escala antes do Bevel e evite superfícies duplicadas."},{"id":"carroca","title":"Carroça medieval — rodas e instâncias","stage":"Modelagem modular","level":"Intermediário","script":null,"goal":"Construir um pequeno veículo de cenário usando repetição radial, rodas simétricas e hierarquia de objetos.","steps":[["Planejar proporções","Crie blocos para caixa, quatro vigas e posição das rodas.","Shift + A • S • G","Carroça reconhecível em silhueta."],["Construir base","Modele chassi simples em cubos e prolongue vigas com Extrude.","Tab • E","Chassi não atravessa as rodas."],["Fazer aro","Crie Torus ou anel com malha circular para a primeira roda.","Shift + A → Torus","Roda tem contorno circular legível."],["Repetir raios","Modele um raio e distribua por rotação em torno do centro da roda.","Shift + D • R","Raios são regulares e não cruzam o cubo central."],["Clonar rodas","Duplique a primeira roda com Alt + D para manter malha compartilhada.","Alt + D • G","Duas ou quatro rodas no lugar correto."],["Criar laterais","Modele uma tábua e use Array para paredes laterais baixas.","Add Array Modifier","Bordas com tábuas uniformes."],["Hierarquia","Adicione Empty mestre e use Ctrl + P para reunir peças sem mesclar malhas.","Shift + A → Empty • Ctrl + P","Mover Empty desloca toda a carroça."],["Finalizar","Aplique madeira e ferro, renomeie objetos e teste render e exportação.","F2 • Shading • F12","Asset utilizável no cenário."]],"pitfall":"Não una tudo cedo; rodas devem permanecer objetos separados se forem animadas."},{"id":"caixa_scifi","title":"Caixa sci-fi — Boolean e acabamento limpo","stage":"Hard-surface","level":"Intermediário","script":null,"goal":"Aprender hard-surface controlando cortes, Bevel, normais e detalhes repetidos sem redesenhar manualmente os polígonos.","steps":[["Blockout","Adicione cubo de caixa e aplique a escala antes de modificadores.","Shift + A • S • Ctrl + A","Escalas em 1 e formato definido."],["Preparar cortadores","Faça três cubos finos que atravessam a superfície da caixa.","Shift + D • G","Cortadores com dimensões visíveis."],["Fazer recessos","Boolean Difference para criar painel rebaixado ou encaixe.","Add Boolean Modifier","Cortes aparecem sem faces aleatórias."],["Arredondar arestas","Adicione Bevel após cortes, com largura pequena e segmentos 2–3.","Add Bevel Modifier","Bordas captam luz sem arredondar excessivamente."],["Ajustar normais","Use Shade Auto Smooth/normal conforme versão e, se necessário, Weighted Normal após Bevel.","Object → Shade • Add Weighted Normal","Planos continuam planos."],["Repetir componentes","Duplique parafusos e travas com Alt + D ou Array.","Alt + D • Add Array Modifier","Elementos idênticos sem refazer malha."],["Materiais por zona","Crie metal pintado, borracha e luzes emissivas com máscaras ou atribuições de faces.","Material Properties • Shading","Materiais ficam em áreas corretas."],["Preparar entrega","Teste wireframe, UV, render e exportação do GLB.","Z → Wireframe • U • F12","Modelo sombreado corretamente na engine."]],"pitfall":"Boolean pode produzir n-gons; inspecione sombreamento e topologia depois dos cortes."},{"id":"criatura","title":"Criatura de fantasia — sculpt, remesh e retopo","stage":"Escultura + otimização","level":"Avançado","script":null,"goal":"Esculpir criatura orgânica e reconstruir uma versão com malha adequada para jogo.","steps":[["Planejar silhueta","Bloqueie cabeça, tronco e membros com esferas/cápsulas; avalie frente e perfil.","Shift + A • Numpad 1/3","Silhueta identificável sem detalhes."],["Unificar forma","Faça cópia de segurança e use Voxel Remesh apenas na cópia de escultura.","Sculpt Mode → Remesh","Volumes se tornam massa contínua."],["Esculpir volumes","Use Grab para proporção, Clay Strips para massa, Smooth apenas onde necessário.","Grab / Clay Strips / Smooth","Olhos e membros reconhecíveis sem ruído fino."],["Definir detalhes","Use Crease em boca e dobras; evite microdetalhes antes de fechar formas grandes.","Sculpt Mode → Crease","Formas primárias continuam legíveis."],["Retopologia","Crie malha low-poly nova sobre a escultura, com Mirror e Shrinkwrap quando adequado.","Add Mirror • Add Shrinkwrap","Loops seguem articulações principais."],["UV organizada","Marque costuras nas costas, faça unwrap e cheque com textura quadriculada.","Ctrl + E → Mark Seam • U","Sem esticamento severo na face."],["Bake de Normal","Alinhe high/low, configure Selected to Active e bake de Normal em imagem ativa.","Render Properties → Bake","Detalhes da escultura aparecem no low-poly."],["Entrega e teste","Crie material simples, teste deformações com pose e exporte asset.","Pose Mode • F12 • File → Export","Low-poly pronto para próximos passos de rig."]],"pitfall":"Sculpt high-poly não é automaticamente um modelo pronto para animação; a retopologia é obrigatória nesse fluxo."},{"id":"pintura","title":"Madeira pintada à mão — Texture Paint","stage":"UV + pintura digital","level":"Intermediário","script":null,"goal":"Criar um material estilizado pintado diretamente no modelo, sem depender de texturas externas.","steps":[["Criar suporte","Modele uma placa retangular com Bevel discreto e aplique escala.","Shift + A • S • Ctrl + A","Placa tem proporção e espessura."],["Abrir UV","Marque costuras laterais e faça Unwrap; inspecione ilhas no UV Editor.","Tab → U","UV sem faces sobrepostas indevidamente."],["Criar imagem","No UV Editor crie Image 1024×1024 para pintura; conecte Image Texture ao shader.","UV Editor → New • Shading","A imagem aparece no material."],["Pintura base","Entre em Texture Paint e cubra com cor principal de madeira.","Texture Paint Mode","Superfície inteira possui cor de base."],["Veios e nós","Pinte linhas longitudinais e pequenos nós; use variação de tom, não faixas idênticas.","Draw Brush","Veios acompanham a direção da madeira."],["Bordas gastas","Pinte lascas claras em quinas e sujeira mais escura nas cavidades.","Brush Size / Strength","Desgaste concentrado em locais plausíveis."],["Acabamento shader","Use Roughness alta para madeira e um Bump sutil apenas se houver mapa apropriado.","Shading → Principled BSDF","Reflexo não parece plástico."],["Salvar recursos","Image → Save As ou File → External Data → Pack Resources e renderize.","Image → Save As • F12","Imagem de textura continua vinculada após reabrir."]],"pitfall":"Salve a imagem pintada em disco ou empacote-a; salvar só o .blend pode não bastar em algumas configurações."},{"id":"pedra_pbr","title":"Pedra antiga — materiais, máscara e iluminação","stage":"Shaders + render","level":"Intermediário","script":null,"goal":"Modelar pedestal rochoso, criar variação de pedra, lascas e musgo sem uma biblioteca fotográfica obrigatória.","steps":[["Forma inicial","Modele bloco de pedra usando cubo e aplique escala.","Shift + A • S • Ctrl + A","Bloco principal possui silhueta sólida."],["Fazer lascas","Edite alguns vértices e adicione Bevel restrito, mantendo faces grandes.","Tab • 1 • G • Ctrl + B","Quinas têm lascas assimétricas."],["Gerar ruído","No Shader Editor: Texture Coordinate → Noise Texture → ColorRamp.","Shading → Shift + A","Existe variação de luminância no material."],["Cores da pedra","ColorRamp com 3 cinzas terrosos ligado ao Base Color do Principled.","ColorRamp → Base Color","Pedra não tem cor totalmente uniforme."],["Saliência sutil","Ligue Noise/ColorRamp ao Bump Height, depois ao Normal do Principled.","Bump Node","Relevo pequeno não distorce a silhueta."],["Adicionar musgo","Use máscara por Noise e, se necessário, Geometry/Normal para concentrar verde em áreas superiores.","Mix Color • ColorRamp","Musgo aparece em bolsões, não em toda a rocha."],["Iluminação","Crie uma Area Light lateral e outra suave de preenchimento; use Filmic/AgX conforme Blender.","Shift + A → Light • Render Properties","Volume e relevo são visíveis."],["Render e revisão","Teste Material Preview e render; diminua Scale do Noise se textura estiver miúda.","Z → Material Preview • F12","Materiais continuam críveis em escala de cena."]],"pitfall":"Bump exagerado pode parecer plástico quebrado; o efeito depende da escala do objeto e dos nós."},{"id":"andar_ciclo","title":"Ciclo de caminhada — 24 quadros de personagem","stage":"Rigging + animação","level":"Avançado","script":null,"goal":"Criar um walk cycle curto e verificável, com contato, passagem, altura do quadril e edição das curvas.","steps":[["Preparar rig","Abra personagem rigado; entre em Pose Mode e defina frames 1–24 com pose neutra testada.","Ctrl + Tab • Timeline","Ossos deformam malha corretamente."],["Contato esquerdo","Frame 1: pé esquerdo à frente, direito atrás, braços em oposição; insira keyframes de pose.","I no Pose Mode","Contatos estão sobre o chão."],["Passagem","Frame 7: pé direito passa pelo centro, quadril levemente mais alto.","Frame 7 • I","Peso e altura mudam sem deslize extremo."],["Contato direito","Frame 13: inverta braços/pernas a partir do contato esquerdo.","Frame 13 y com Constant Offset","Repetição regular e totalmente editável","Array"],["Dois lados de uma espada","Modelar esquerda e direita separadamente","Mirror com Clipping e origem central","Simetria enquanto edita","Mirror"],["Criar furos em madeira","Desenhar cada abertura manualmente","Boolean Difference com objeto cortador","Controle paramétrico de cortes","Boolean"],["Arredondar bordas","Extrusões e cortes em cada aresta","Bevel Modifier com largura baixa","Acabamento uniforme e reversível","Bevel"],["Criar várias árvores","Duplicações independentes","Alt + D ou instâncias Geometry Nodes","Menos dados de geometria duplicada","Instancing"],["Criar parede de tijolos","Desenhar tijolos individualmente","Array 2D ou instâncias por Geometry Nodes","Controle de quantidade e espaçamento","Geometry Nodes"],["Criar simetria de personagem","Selecionar vértice por vértice em ambos lados","Mirror e edição proporcional na massa","Ajustes rápidos e coerentes","Mirror"],["Pintar ferrugem","Pintar tudo de laranja","Máscara de desgaste + Mix entre ferro e óxido","Metal e ferrugem respondem à luz diferentemente","Mix Shader"],["Criar milhares de folhas","Malhas exclusivas em cada ramo","Instâncias de geometria de folha","Memória e manutenção melhores","Geometry Nodes"],["Textura para cada face","Reposicionar imagem manualmente","UV Unwrap + seams + orientação de ilhas","Direção e escala consistentes","UV Editing"],["Pedra detalhada no jogo","Malha com milhões de faces","High/Low + baking de Normal","Silhueta leve e detalhes de superfície","Bake"],["Caminhada simples","Animar os vértices um a um","Armature + keyframes e F-Curves","Rig reutilizável e melhor controle","Rigging"],["Variação de materiais","Criar 20 materiais quase iguais","Material compartilhado + variação por atributo","Ajustes globais centralizados","Material nodes"],["Render lento para testar","Sempre Cycles com samples altos","Material Preview / Eevee e baixa amostragem","Iteração mais rápida","Render Preview"],["Ajust se Color</span></div><hr><div class="a4-graph"><span class="a4-node">Roughness (Non-Color)</span><span class="a4-arrow">→</span><span class="a4-node">Principled • Roughness</span></div><hr><div class="a4-graph"><span class="a4-node">Normal_OpenGL (Non-Color)</span><span class="a4-arrow">→</span><span class="a4-node">Normal Map</span><span class="a4-arrow">→</span><span class="a4-node">Principled • Normal</span></div><hr><div class="a4-graph"><span class="a4-node">Height (Non-Color)</span><span class="a4-arrow">→</span><span class="a4-node">Bump • Height (opcional)</span><span class="a4-arrow">→</span><span class="a4-node">Normal</span></div><div class="a4-note"><b>Atenção:</b> BaseColor usa sRGB; Roughness, Normal e Height usam Non-Color. Para metal parcialmente enferrujado, use máscara para Metallic: ferrugem = 0, ferro exposto = 1. Os mapas desta apostila são demonstrativos.</div><p><b>Arquivos locais:</b> <code>pbr_1k/${esc(m[0])}/${esc(m[0])}_BaseColor.png</code> e outros 3 mapas.</p><p>O script <code>aplicar_texturas_pbr.py</code> configura os nodes automaticamente no Blender depois que você aponta a pasta correta.</p></div></div>`}

 (Sequencer)","desc":"Seleciona strips visíveis.","page":41},{"area":"Extras","action":"Excluir strip","key":"X","desc":"Remove strip selecionado.","page":41},{"area":"Extras","action":"Entrar em Draw Mode","key":"Ctrl + Tab > Draw Mode","desc":"Desenha strokes em camadas.","page":41},{"area":"Extras","action":"Novo quadro Grease Pencil","key":"I (contextual)","desc":"No modo desenho, pode inserir quadros; ver mapa da versão.","page":41},{"area":"Extras","action":"Editar strokes","key":"Tab / seletor de modo","desc":"Alterna para edição de pontos e strokes.","page":41}],"modifiers":[{"name":"Data Transfer","group":"EDIT","desc":"Transfere mapas UV, cores, grupos de vértices e outros dados entre malhas por correspondência espacial.","use":"copiar atributos de um modelo fonte para outro de geometria diferente.","caution":"Confira a correspondência espacial, seleção das camadas e opções de mapeamento.","essential":false,"page":43},{"name":"Mesh Cache","group":"EDIT","desc":"Reproduz deformações de malha vindas de cache externo, como MDD/PC2.","use":"importar simulações e animações de vértices de outros aplicativos.","caution":"A topologia precisa corresponder à do cache.","essential":false,"page":43},{"name":"Mesh Sequence Cache","group":"EDIT","desc":"Usa sequência de geometria de cache de produção, como Alembic.","use":"trabalhar com animações complexas já calculadas em pipeline.","caution":"Depende de cache externo válido e relações corretas.","essential":false,"page":43},{"name":"UV Project","group":"EDIT","desc":"Projeta coordenadas UV utilizando um ou mais objetos projetores, inclusive câmeras.","use":"projetar logotipos, textura de cenário ou vídeo em superfícies.","caution":"Distorções aparecem fora do cone ou ângulo de projeção.","essential":false,"page":43},{"name":"UV Warp","group":"EDIT","desc":"Transforma coordenadas UV por referências de objetos, animando deslocamentos.","use":"fazer textura deslizar sem mover a malha.","caution":"O resultado depende de referências e do UV Map selecionado.","essential":false,"page":44},{"name":"Vertex Weight Edit","group":"EDIT","desc":"Modifica pesos de um grupo por curva, limiar e influência.","use":"corrigir gradientes e pesos controladores proceduralmente.","caution":"Altere grupo correto; pode afetar deformação final.","essential":false,"page":44},{"name":"Vertex Weight Mix","group":"EDIT","desc":"Combina matematicamente pesos de dois grupos de vértices.","use":"mesclar máscaras e influências de vários controladores.","caution":"Defina como tratar vértices ausentes nos grupos.","essential":false,"page":44},{"name":"Vertex Weight Proximity","group":"EDIT","desc":"Define pesos a partir da distância até objeto/geométrica de referência.","use":"ativar deformação por proximidade, como efeito de aproximação.","caution":"Cuidado com escala e espaço de distâncias.","essential":false,"page":44},{"name":"Array","group":"GENERATE","desc":"Repete elementos de geometria por deslocamento ou configurações procedurais da versão atual.","use":"criar cercas, grades, degraus e objetos repetidos.","caution":"No 5.2, diferencie o Array novo da alternativa Legacy.","essential":true,"page":44},{"name":"Array (Legacy)","group":"GENERATE","desc":"Repete uma malha por contagem e deslocamento relativo/constante da implementação clássica.","use":"seguir tutoriais antigos ou configurar repetições clássicas.","caution":"Verifique compatibilidade e mudanças do Array novo.","essential":false,"page":45},{"name":"Bevel","group":"GENERATE","desc":"Cria chanfros e arredondamentos nas arestas de um objeto.","use":"deixar caixas, móveis e peças rígidas com bordas realistas.","caution":"Aplique escala quando necessário e evite intersecções exageradas.","essential":true,"page":45},{"name":"Boolean","group":"GENERATE","desc":"Realiza Difference, Union e Intersect entre geometrias.","use":"abrir buracos, janelas, encaixes e perfurações.","caution":"Malhas ruins podem gerar topologia difícil; revise normais.","essential":true,"page":45},{"name":"Build","group":"GENERATE","desc":"Faz faces surgirem ou desaparecerem ao longo do tempo.","use":"criar revelação progressiva de estruturas.","caution":"A ordem das faces pode alterar a aparência do efeito.","essential":false,"page":45},{"name":"Curve to Tube","group":"GENERATE","desc":"Converte geometrias de curva em tubos com espessura.","use":"criar cabos, canos e fios a partir de trajetórias.","caution":"Ajuste raio, resolução e necessidade de UV/exportação.","essential":false,"page":45},{"name":"Decimate","group":"GENERATE","desc":"Reduz a quantidade de polígonos preservando a forma aproximadamente.","use":"otimizar esculturas e modelos muito densos para jogos.","caution":"Excesso de redução distorce silhueta e topologia.","essential":true,"page":45},{"name":"Edge Split","group":"GENERATE","desc":"Separa arestas em determinadas condições, dividindo superfícies conectadas.","use":"obter quebras rígidas em bordas específicas.","caution":"Pode criar partes desconectadas; nem sempre é a solução ideal.","essential":false,"page":46},{"name":"Mask","group":"GENERATE","desc":"Oculta partes da malha usando grupos de vértices ou ossos.","use":"mostrar apenas componentes selecionados por uma máscara.","caution":"A visibilidade depende dos dados de máscara.","essential":false,"page":46},{"name":"Mesh to Volume","group":"GENERATE","desc":"Converte uma malha em representação volumétrica de densidade.","use":"efeitos volumétricos e workflows de volumes.","caution":"Volume não é a mesma coisa que mesh exportável.","essential":false,"page":46},{"name":"Mirror","group":"GENERATE","desc":"Espelha a geometria em X/Y/Z ao redor da origem ou referência.","use":"modelar metade de rosto, corpo, armas e peças simétricas.","caution":"Ative Clipping/Merge e revise o eixo e origem.","essential":true,"page":46},{"name":"Multiresolution","group":"GENERATE","desc":"Adiciona níveis de subdivisão armazenando detalhes de escultura em cada nível.","use":"esculpir detalhes finos mantendo níveis menores de resolução.","caution":"É sensível à ordem da pilha e às alterações de topologia.","essential":true,"page":46},{"name":"Remesh","group":"GENERATE","desc":"Reconstrói topologia de malha com distribuição mais uniforme.","use":"limpar blocagem e esculturas booleanas para continuar esculpindo.","caution":"Pode eliminar arestas/UVs necessários à produção.","essential":true,"page":46},{"name":"Scatter on Surface","group":"GENERATE","desc":"Distribui instâncias ou elementos sobre uma superfície.","use":"espalhar grama, pedras e vegetação proceduralmente.","caution":"Controle densidade, escala e custo de instâncias.","essential":false,"page":47},{"name":"Screw","group":"GENERATE","desc":"Revolve perfil em torno de um eixo, criando corpo tridimensional.","use":"produzir taças, vasos, latas e peças torneadas.","caution":"Defina eixo, ângulo e número de passos adequados.","essential":false,"page":47},{"name":"Skin","group":"GENERATE","desc":"Gera superfície ao redor de estrutura de arestas/vértices.","use":"criar membros e blocagens orgânicas a partir de linhas.","caution":"Controle raios dos vértices e subdivisão posterior.","essential":false,"page":47},{"name":"Solidify","group":"GENERATE","desc":"Acrescenta espessura a superfícies originalmente finas.","use":"criar tecidos grossos, paredes, capas e chapas.","caution":"Superfícies autointersectantes podem gerar falhas.","essential":true,"page":47},{"name":"Subdivision Surface","group":"GENERATE","desc":"Refina uma malha e suaviza sua forma pela subdivisão.","use":"modelar personagens, superfícies suaves e carcaças.","caution":"Pode alterar silhueta; use loops de suporte/creases.","essential":true,"page":47},{"name":"Triangulate","group":"GENERATE","desc":"Converte faces poligonais em triângulos.","use":"controlar triangulação para exportar assets e shading de games.","caution":"A disposição de triângulos pode afetar deformação.","essential":false,"page":47},{"name":"Volume to Mesh","group":"GENERATE","desc":"Converte densidade de volume em superfície poligonal.","use":"produzir malha a partir de campo volumétrico.","caution":"Limiares e resolução impactam forma e desempenho.","essential":false,"page":48},{"name":"Weld","group":"GENERATE","desc":"Une vértices próximos dentro de uma distância definida.","use":"limpar costuras e pontos coincidentes.","caution":"Distância alta pode colapsar partes da malha.","essential":false,"page":48},{"name":"Wireframe","group":"GENERATE","desc":"Transforma as arestas da malha em estrutura de barras.","use":"criar grades, esqueletos metálicos e wireframes visíveis.","caution":"A espessura interage com densidade de malha.","essential":false,"page":48},{"name":"Armature","group":"DEFORM","desc":"Deforma a malha segundo ossos e pesos de vértices.","use":"animar personagens e partes articuladas.","caution":"Revise weights e rest pose para evitar colapsos.","essential":true,"page":48},{"name":"Cast","group":"DEFORM","desc":"Empurra geometria na direção de esfera, cilindro ou cubo.","use":"arredondar ou regularizar certas formas.","caution":"Fator exagerado altera a silhueta além do esperado.","essential":false,"page":48},{"name":"Curve","group":"DEFORM","desc":"Deforma objetos seguindo o traçado de uma curva.","use":"criar estradas, tubulações, faixas e textos curvos.","caution":"Origem e eixos precisam estar coerentes.","essential":false,"page":49},{"name":"Displace","group":"DEFORM","desc":"Desloca vértices por imagem, textura procedural ou atributo.","use":"criar rochas, terrenos e relevos.","caution":"A malha exige resolução suficiente para mostrar o efeito.","essential":false,"page":49},{"name":"Hook","group":"DEFORM","desc":"Move conjuntos de vértices por transformações de outro objeto.","use":"controlar pontos específicos com empties.","caution":"Vínculo e origem dos grupos precisam ser configurados.","essential":false,"page":49},{"name":"Laplacian Deform","group":"DEFORM","desc":"Preserva forma local durante deformações por âncoras.","use":"dobrar modelos com detalhes sem perder todo o volume.","caution":"Requer âncoras e etapa de bind adequada.","essential":false,"page":49},{"name":"Lattice","group":"DEFORM","desc":"Deforma geometria através de uma gaiola de controle flexível.","use":"ajustar silhueta inteira sem tocar em cada vértice.","caution":"Resolução da gaiola controla flexibilidade.","essential":false,"page":49},{"name":"Mesh Deform","group":"DEFORM","desc":"Deforma objeto envolvido por outra malha usada como gaiola.","use":"fazer deformações complexas com malha controladora.","caution":"Envolvimento e bind influenciam resultado.","essential":false,"page":49},{"name":"Shrinkwrap","group":"DEFORM","desc":"Projeta ou ajusta vertices sobre uma superfície-alvo.","use":"colar roupas no corpo ou realizar retopologia.","caution":"Offset pequeno pode causar z-fighting e interseções.","essential":true,"page":50},{"name":"Simple Deform","group":"DEFORM","desc":"Aplica torção, curvatura, afunilamento ou alongamento.","use":"criar arcos, espirais, fitas torcidas e deformações rápidas.","caution":"Defina eixo e origem corretamente.","essential":false,"page":50},{"name":"Smooth","group":"DEFORM","desc":"Suaviza posições dos vértices para reduzir irregularidades.","use":"diminuir ondulações e ruído de superfície.","caution":"Pode encolher e descaracterizar o objeto.","essential":false,"page":50},{"name":"Smooth Corrective","group":"DEFORM","desc":"Corrige deformações perto de juntas e regiões articuladas.","use":"melhorar cotovelos, ombros, joelhos durante animação.","caution":"É necessário configurar referências de pose adequadas.","essential":false,"page":50},{"name":"Smooth Laplacian","group":"DEFORM","desc":"Suavização com preservação mais controlada do volume.","use":"suavizar superfícies evitando parte do encolhimento.","caution":"Parâmetros inadequados podem distorcer malha.","essential":false,"page":50},{"name":"Surface Deform","group":"DEFORM","desc":"Vincula uma malha a outra superfície para seguir a deformação.","use":"fixar elementos secundários em malha animada.","caution":"O bind depende da geometria e do posicionamento.","essential":false,"page":50},{"name":"Volume Displace","group":"DEFORM","desc":"Desloca conteúdo de um volume, modificando seu campo de densidade.","use":"animar ruído em fumaça ou objetos volumétricos.","caution":"Funciona com volume, não com mesh como Displace comum.","essential":false,"page":51},{"name":"Warp","group":"DEFORM","desc":"Deforma a malha a partir de dois objetos de referência.","use":"criar transição/deformação localizada entre controladores.","caution":"Força e falloff determinam a área atingida.","essential":false,"page":51},{"name":"Wave","group":"DEFORM","desc":"Gera ondas periódicas que se deslocam na superfície.","use":"animar água simplificada, vibrações e ripple.","caution":"A malha precisa de subdivisões suficientes.","essential":false,"page":51},{"name":"Normal Edit","group":"NORMALS","desc":"Modifica normais personalizadas para dirigir o sombreamento da superfície.","use":"controlar shading de malhas e peças rígidas especiais.","caution":"Normais não corrigem geometria quebrada.","essential":false,"page":51},{"name":"Weighted Normal","group":"NORMALS","desc":"Ajusta normais dando maior influência a faces maiores e configurações.","use":"melhorar shading de hard surface com faces amplas.","caution":"Depende das opções de suavização e geometria.","essential":false,"page":51},{"name":"Smooth By Angle","group":"NORMALS","desc":"Controla suavização por ângulo de forma baseada em Geometry Nodes.","use":"separar visualmente arestas suaves e duras por ângulo.","caution":"No Blender recente pode aparecer como asset de nós e não modifier clássico.","essential":false,"page":52},{"name":"Cloth","group":"PHYSICS","desc":"Simula tecido sob forças, colisões e propriedades físicas.","use":"animar capas, bandeiras e roupas.","caution":"Ajuste colisões e simule/cache antes do render final.","essential":false,"page":52},{"name":"Collision","group":"PHYSICS","desc":"Marca objeto para colisões com sistemas físicos compatíveis.","use":"impedir pano e partículas de atravessar obstáculos.","caution":"Espessura e escala afetam estabilidade.","essential":false,"page":52},{"name":"Dynamic Paint","group":"PHYSICS","desc":"Usa colisões para pintar, deslocar ou gerar efeitos dinâmicos em superfícies.","use":"criar pegadas, molhado e marcas animadas.","caution":"Configure objetos Brush e Canvas nos painéis de física.","essential":false,"page":52},{"name":"Explode","group":"PHYSICS","desc":"Separa malha em fragmentos controlados por sistema de partículas.","use":"simular fragmentação e efeito de desmontagem.","caution":"Recurso de pipeline clássico; verificar configuração na versão.","essential":false,"page":52},{"name":"Fluid","group":"PHYSICS","desc":"Liga objeto a um domínio ou fluxo de líquido/gás.","use":"simular fumaça, fogo, líquidos e obstáculos.","caution":"Precisa de domínio, resoluções adequadas e bake.","essential":false,"page":53},{"name":"Ocean","group":"PHYSICS","desc":"Cria superfície oceânica animada com ondas paramétricas.","use":"formar mar e superfície de água extensa.","caution":"Pode exigir ajuste de shading e caches para espuma.","essential":false,"page":53},{"name":"Particle Instance","group":"PHYSICS","desc":"Instancia objetos a partir de partículas de outro sistema.","use":"usar sistemas legados de partículas em cenas específicas.","caution":"Compatibilidade com workflows novos deve ser avaliada.","essential":false,"page":53},{"name":"Particle System","group":"PHYSICS","desc":"Representa etapa de sistema de partículas tradicional.","use":"manter projetos legados com partículas.","caution":"Para projetos novos, considere Geometry Nodes conforme necessidade.","essential":false,"page":53},{"name":"Soft Body","group":"PHYSICS","desc":"Simula deformações elásticas em malhas flexíveis.","use":"criar objetos gelatinosos, molas e massas deformáveis.","caution":"Colisões e cache podem custar processamento.","essential":false,"page":53},{"name":"Array","group":"GP","desc":"Duplica strokes em padrões e deslocamentos.","use":"repetir elementos de desenhos técnicos.","caution":"Aumenta quantidade de geometria visível.","essential":false,"page":56},{"name":"Build","group":"GP","desc":"Revela traços ao longo dos frames.","use":"efeito de desenho aparecendo na tela.","caution":"O ritmo depende da ordem dos strokes.","essential":false,"page":56},{"name":"Dot Dash","group":"GP","desc":"Substitui segmentos por padrões de pontos e traços.","use":"linhas pontilhadas estilizadas.","caution":"A escala muda aparência do padrão.","essential":false,"page":56},{"name":"Envelope","group":"GP","desc":"Gera contornos envolvendo strokes.","use":"compor forma externa de desenhos.","caution":"Pode aproximar detalhes estreitos.","essential":false,"page":56},{"name":"Length","group":"GP","desc":"Encurta ou alonga strokes.","use":"efeito de extensão de traçado.","caution":"Resultados variam com o comprimento.","essential":false,"page":56},{"name":"Line Art","group":"GP","desc":"Converte contornos e oclusões de geometria 3D em desenho.","use":"contornar personagens ou edifícios em 2D.","caution":"Configure câmera, materiais e limites de oclusão.","essential":false,"page":57},{"name":"Mirror","group":"GP","desc":"Espelha strokes em eixos de referência.","use":"desenho simétrico 2D/3D.","caution":"A origem controla a simetria.","essential":false,"page":57},{"name":"Multiple Strokes","group":"GP","desc":"Adiciona strokes derivados de uma entrada.","use":"enriquecer linha com traços secundários.","caution":"Uso excessivo gera visual poluído.","essential":false,"page":57},{"name":"Outline","group":"GP","desc":"Cria linhas de contorno ao redor de strokes.","use":"fazer arte com aparência de borda externa.","caution":"Escala e espessura precisam harmonizar.","essential":false,"page":57},{"name":"Simplify","group":"GP","desc":"Reduz pontos de controle mantendo a forma aproximada.","use":"limpar desenhos pesados.","caution":"Simplificação excessiva perde detalhes.","essential":false,"page":57},{"name":"Subdivide","group":"GP","desc":"Acrescenta pontos intermediários nos strokes.","use":"suavizar linhas e preparar deformações.","caution":"Mais pontos aumentam processamento.","essential":false,"page":57},{"name":"Armature","group":"GP","desc":"Deforma desenhos usando ossos.","use":"animar cutouts e personagens 2D.","caution":"Os pesos devem combinar com as camadas.","essential":false,"page":58},{"name":"Hook","group":"GP","desc":"Controla pontos por empties/objetos.","use":"animar detalhes locais de desenho.","caution":"Defina corretamente as influências.","essential":false,"page":58},{"name":"Lattice","group":"GP","desc":"Deforma desenhos via grade controladora.","use":"ajustar silhueta de strokes.","caution":"Grade muito densa dificulta manipulação.","essential":false,"page":58},{"name":"Noise","group":"GP","desc":"Acrescenta variação aleatória aos strokes.","use":"gerar tremor e sensação de animação artesanal.","caution":"Excesso de ruído prejudica leitura.","essential":false,"page":58},{"name":"Offset","group":"GP","desc":"Desloca, gira ou escala strokes de maneira procedural.","use":"aplicar variações automáticas na camada.","caution":"A origem altera o efeito.","essential":false,"page":58},{"name":"Shrinkwrap","group":"GP","desc":"Ajusta desenho à superfície-alvo.","use":"colocar Grease Pencil sobre modelos 3D.","caution":"Offset inadequado gera sobreposição visível.","essential":false,"page":58},{"name":"Smooth","group":"GP","desc":"Suaviza posições e parâmetros de strokes.","use":"corrigir traço irregular.","caution":"Pode eliminar personalidade do desenho.","essential":false,"page":59},{"name":"Thickness","group":"GP","desc":"Altera grossura das linhas.","use":"variar espessura e criar hierarquia visual.","caution":"Linha muito fina desaparece no render.","essential":false,"page":59},{"name":"Hue/Saturation","group":"GP","desc":"Altera matiz e saturação da cor de strokes.","use":"harmonizar paleta de animações.","caution":"Pode descaracterizar cores de referência.","essential":false,"page":59},{"name":"Opacity","group":"GP","desc":"Controla transparência dos strokes.","use":"fazer fade, fantasmas e camadas translúcidas.","caution":"Empilhamento muda resultado final.","essential":false,"page":59},{"name":"Tint","group":"GP","desc":"Aplica tonalização às cores dos strokes.","use":"mudar paleta global de um desenho.","caution":"Considere a cor original dos materiais.","essential":false,"page":59},{"name":"Texture Mapping","group":"GP","desc":"Ajusta transformação da textura associada aos traços.","use":"reposicionar padrões de materiais Grease Pencil.","caution":"Depende das configurações do material.","essential":false,"page":60},{"name":"Time Offset","group":"GP","desc":"Desloca quais frames Grease Pencil são exibidos ao longo do tempo.","use":"reutilizar ciclos ou atrasar camadas.","caution":"Verifique looping e duração.","essential":false,"page":60},{"name":"Vertex Weight Angle","group":"GP","desc":"Calcula pesos usando ângulo do traço.","use":"controlar estilo ou deformação por direção.","caution":"O espaço de referência é importante.","essential":false,"page":60},{"name":"Vertex Weight Proximity","group":"GP","desc":"Calcula pesos pela proximidade de elementos.","use":"variar visual do traço conforme objetos vizinhos.","caution":"Raios de influência determinam o alcance.","essential":false,"page":60},{"name":"Generator","group":"F-CURVE","desc":"Produz animação por função polinomial.","use":"criar curva de movimento baseada em fórmula matemática.","caution":"O grau alto pode gerar curvas imprevisíveis.","essential":false,"page":60},{"name":"Built-in Function","group":"F-CURVE","desc":"Aplica senos, cossenos e outras funções matemáticas.","use":"criar vibrações e oscilação controlada.","caution":"Amplitude e fase alteram todo o movimento.","essential":false,"page":61},{"name":"Envelope","group":"F-CURVE","desc":"Controla valores mínimo/máximo da curva ao longo do tempo.","use":"aumentar e reduzir intensidade de uma animação.","caution":"Pontos adicionais determinam trechos da influência.","essential":false,"page":61},{"name":"Cycles","group":"F-CURVE","desc":"Repete a curva F antes/depois dos keyframes.","use":"criar caminhada em loop ou objeto girando continuamente.","caution":"Precisa da posição correta na pilha.","essential":false,"page":61},{"name":"Noise","group":"F-CURVE","desc":"Adiciona ruído procedural aos valores animados.","use":"fazer tremor de câmera, vibração e irregularidade.","caution":"Dose de ruído alta torna animação caótica.","essential":false,"page":61},{"name":"Limits","group":"F-CURVE","desc":"Restringe a curva a limites de frames e valores.","use":"manter animação dentro de faixa definida.","caution":"Pode achatar a curva em limite muito estreito.","essential":false,"page":61},{"name":"Stepped Interpolation","group":"F-CURVE","desc":"Mantém valores em patamares por N frames.","use":"imitar stop-motion ou animação com poucos quadros.","caution":"Movimento fica intencionalmente travado.","essential":false,"page":61},{"name":"Smooth (Gaussian)","group":"F-CURVE","desc":"Suaviza matematicamente a curva animada.","use":"reduzir pequenas oscilações de captura/movimento.","caution":"Pode pesar e conflitar com Cycles na pilha.","essential":false,"page":62},{"name":"Brightness/Contrast","group":"SEQUENCER","desc":"Altera brilho e contraste de imagens ou clipes.","use":"corrigir um trecho escuro ou sem contraste.","caution":"Evite estourar brancos e esmagar sombras.","essential":false,"page":62},{"name":"Color Balance","group":"SEQUENCER","desc":"Controla tons escuros, médios e claros.","use":"corrigir tonalidade ou fazer color grading.","caution":"Revise imagem em espaço de cor correto.","essential":false,"page":62},{"name":"Compositor","group":"SEQUENCER","desc":"Aplica grupo de nós do compositor como modifier de strip.","use":"reutilizar efeitos organizados em nós.","caution":"Requer node group compatível e asset corretamente definido.","essential":false,"page":62},{"name":"Curves","group":"SEQUENCER","desc":"Ajusta canais RGB por curvas.","use":"fazer contraste e ajustes finos de cor.","caution":"Pode saturar áreas facilmente.","essential":false,"page":62},{"name":"Hue Correct","group":"SEQUENCER","desc":"Muda seletivamente matiz, saturação ou valor de cores.","use":"corrigir uma cor específica no vídeo.","caution":"Máscaras/seleção tonal podem ter bordas duras.","essential":false,"page":63},{"name":"Mask","group":"SEQUENCER","desc":"Modula o canal alfa por máscara ou strip.","use":"criar recortes e efeitos localizados.","caution":"Verifique sincronismo da máscara no tempo.","essential":false,"page":63},{"name":"Tone Map","group":"SEQUENCER","desc":"Mapeia imagens com grande alcance tonal para exibição.","use":"tratar contraste em cenas com alta amplitude luminosa.","caution":"Parâmetros afetam detalhe em sombras e altas luzes.","essential":false,"page":63},{"name":"White Balance","group":"SEQUENCER","desc":"Compensa tendência de cor da iluminação.","use":"corrigir imagem excessivamente azulada ou amarela.","caution":"Não substitui correção tonal completa.","essential":false,"page":63},{"name":"Chromatic Aberration","group":"SEQUENCER","desc":"Simula separação cromática nas bordas da lente.","use":"efeito de lente cinematográfico.","caution":"Exagero reduz nitidez percebida.","essential":false,"page":63},{"name":"Film Grain","group":"SEQUENCER","desc":"Acrescenta grão de filme.","use":"dar aparência analógica ao vídeo.","caution":"Ruído em excesso perde detalhe e eleva compressão.","essential":false,"page":63},{"name":"Sensor Noise","group":"SEQUENCER","desc":"Simula ruído característico de sensor digital.","use":"criar textura de câmera eletrônica.","caution":"Evite efeitos exagerados em cenas limpas.","essential":false,"page":64},{"name":"Vignette","group":"SEQUENCER","desc":"Escurece ou modifica extremidades do quadro.","use":"guiar atenção ao centro da cena.","caution":"Vinheta exagerada esconde informações relevantes.","essential":false,"page":64},{"name":"Sepia","group":"SEQUENCER","desc":"Aplica tonalidade sépia.","use":"simular fotografia antiga.","caution":"Pode reduzir distinção de cores.","essential":false,"page":64},{"name":"Split Toning","group":"SEQUENCER","desc":"Aplica tons distintos em sombras e luzes.","use":"dar estilo de color grading contrastante.","caution":"Dose com cuidado para preservar pele/objetos.","essential":false,"page":64},{"name":"Tune Image","group":"SEQUENCER","desc":"Agrupa ajustes criativos gerais da imagem.","use":"aplicar correções rápidas com conjunto de controles.","caution":"Verifique cada efeito usado.","essential":false,"page":64},{"name":"Unsharp Mask","group":"SEQUENCER","desc":"Aumenta contraste local para dar percepção de nitidez.","use":"realçar detalhes em imagens suavizadas.","caution":"Excesso cria halos em bordas.","essential":false,"page":64},{"name":"Echo","group":"SEQUENCER","desc":"Cria repetições/eco temporal no áudio.","use":"simular ambiente grande ou efeitos dramáticos.","caution":"Níveis altos podem saturar o som.","essential":false,"page":65},{"name":"Pitch","group":"SEQUENCER","desc":"Altera altura tonal do áudio.","use":"ajustar voz ou efeito sonoro criativo.","caution":"Mudanças intensas podem deteriorar naturalidade.","essential":false,"page":65},{"name":"Sound Equalizer","group":"SEQUENCER","desc":"Ajusta intensidade por faixas de frequência.","use":"realçar diálogos e limpar frequências indesejadas.","caution":"Não elimina problemas acústicos complexos.","essential":false,"page":65}],"projects":[{"id":"01","title":"Modelar um baú low-poly","steps":["Adicione um Cube com Shift + A > Mesh > Cube.","No Object Mode use S, X e S, Y para estabelecer proporções; Ctrl + A > Scale para aplicar a escala.","Entre em Edit Mode com Tab. Selecione a face superior (3) e faça Inset (I) para criar uma borda.","Use E para extrudar a tampa e Ctrl + R se precisar controlar a divisão da malha.","Acrescente um Bevel Modifier com 2 ou 3 segmentos em quantidade pequena.","Crie dobradiças duplicando cilindros; organize peças em uma Collection.","Crie materiais simples e exporte como glTF para testar numa engine."],"result":"Você produziu um asset modular com geometria simples, bordas melhores e organização."},{"id":"02","title":"Construir cerca com repetição","steps":["Crie uma única estaca com Cube e ajuste dimensões em Edit Mode.","Defina corretamente a origem e aplique a escala (Ctrl + A > Scale).","Adicione Array na aba Modifiers, escolha modo de distribuição compatível e configure quantidade/espaçamento.","Acrescente uma viga horizontal e, se necessário, outro Array.","Use Bevel pequeno para melhorar bordas; revise normals.","Mantenha instâncias paramétricas até ter certeza da dimensão da cerca."],"result":"Uma cerca de dezenas de peças sem 30 duplicações manuais."},{"id":"03","title":"Fazer uma espada simétrica","steps":["Modele metade da lâmina a partir de uma malha simples, mantendo a linha central alinhada à origem.","Adicione Mirror em X com Merge e Clipping, verificando o eixo de simetria.","Extrude E para alongar a lâmina e S para criar o afunilamento.","Use Ctrl + R para linhas de suporte; trabalhe o pomo/cabo separadamente.","Aplique Bevel com largura pequena para capturar reflexos.","Crie metal e couro no Shading, use iluminação de estúdio e renderize."],"result":"Uma arma com simetria precisa, sem modelar os dois lados."},{"id":"04","title":"Criar um personagem estilizado","steps":["Faça blocagem do corpo com formas simples, cabeça e braços proporcionais.","Una somente peças que precisam compartilhar malha; mantenha acessórios separados.","Use Mirror para modelar metade do corpo e Subdivision Surface se quiser bordas arredondadas.","Antes de esculpir, aplique escala para pincéis consistentes.","Entre em Sculpt Mode, suavize e ajuste volumes maiores antes dos detalhes.","Escolha entre retopologia manual e redução de polígonos conforme destino.","Faça UV e materiais; reserve região para olhos e roupas."],"result":"Uma base pronta para rigging, sem começar pelos detalhes."},{"id":"05","title":"Esculpir uma criatura","steps":["Crie blocagem grosseira com 3 a 6 primitivas em proporções coerentes.","Junte blocos necessários e use voxel remesh para unificar volumes quando adequado.","Ative simetria X e trabalhe primeiro silhueta e planos grandes.","Use brushes de Grab, Clay, Smooth e Crease de acordo com o efeito esperado.","Ajuste tamanho por F e intensidade com Shift + F.","Concluída a forma, reduza densidade via retopo/Decimate para asset final."],"result":"A escultura fica mais rápida ao separar volumes grandes, médios e pequenos."},{"id":"06","title":"Pintar uma textura no objeto","steps":["Garanta que o modelo tenha UVs sem ilhas sobrepostas indesejadas.","Crie material com um Image Texture conectado à Base Color do Principled BSDF.","Crie imagem em resolução adequada e selecione o nó de imagem para pintar.","Entre em Texture Paint, escolha o brush e ajuste F/Shift + F.","Pinte cores gerais primeiro e depois detalhes; utilize Shift + X para amostrar cor.","Use Image > Save / Save As para guardar a textura externa e salve o .blend."],"result":"Imagem UV de fato salva e vinculada ao material, sem perder trabalho."},{"id":"07","title":"Rig básico de braço","steps":["Crie um bone em Shift + A > Armature. Em Edit Mode, extrude (E) até ter braço, antebraço e mão.","Nomeie bones e ajuste cadeia e pivôs nas juntas.","Selecione malha e depois armature ativa; faça Ctrl + P > With Automatic Weights.","Entre Pose Mode e teste rotações R em cada osso.","Se a geometria colapsar, revise Weight Paint e Smooth Corrective quando necessário.","Crie keyframes com I nas poses principais."],"result":"Um rig básico capaz de dobrar o braço com controle por bones."},{"id":"08","title":"Animar objeto com 3 keyframes","steps":["Na Timeline marque frame 1; selecione objeto e use I para registrar transformações.","Vá ao frame 20, mova o objeto e insira outro keyframe.","Vá ao frame 40, volte a uma pose similar à inicial e insira nova chave.","Pressione Espaço para testar playback.","Abra Graph Editor para mudar interpolação via T e ajustar handles.","Se precisar de loop contínuo, adicione F-Curve Modifier > Cycles."],"result":"Animação de ida e volta com controle preciso sobre tempo e aceleração."},{"id":"09","title":"Preparar asset para Unity/Godot","steps":["Congele versão do objeto e organize todas as partes com nomes claros.","Aplique escala e rotação quando fizer sentido, verificando a armature.","Confirme faces corretas por Face Orientation e recalcule normals se necessário.","Finalize UVs e salve texturas em imagens de arquivos reais.","Confira número de triângulos, colisões e existência de animações.","Exporte em glTF 2.0/GLB ou formato pedido pela engine.","Reimporte num projeto vazio e depois teste na engine de destino."],"result":"Um recurso final verificado em vez de apenas um arquivo que abre no Blender."},{"id":"10","title":"Fazer render de produto","steps":["Crie material no Shading com valores de Roughness, Metallic e Base Color adequados.","Adicione uma câmera e use Ctrl + Alt + Num 0 para alinhá-la à vista.","Posicione uma Area Light principal e uma luz de preenchimento.","Selecione Eevee para rapidez ou Cycles para reflexos/iluminação mais exigentes.","Escolha resolução e amostragem nas propriedades de saída e render.","Pressione F12 e salve a imagem com Image > Save As."],"result":"Um render apresentável do seu modelo e configurações salvas no .blend."},{"id":"11","title":"Fazer animação curta com personagem","steps":["Implemente o rig e teste pesos de braço/pernas.","Crie pose inicial e grave keys de transformações dos bones.","Faça pose de antecipação, ação principal e recuperação em frames diferentes.","Edite tempo no Dope Sheet antes de polir curvas no Graph Editor.","Revise pés deslizando e interpenetrações da malha em movimento.","Configure FPS e intervalo de saída; renderize sequência de imagens.","Monte vídeo final no Sequencer se necessário."],"result":"Animação com poses legíveis e curva de movimento refinada."},{"id":"12","title":"Cena procedural de floresta","steps":["Modele duas pedras e duas árvores low-poly; defina origens e variações.","Crie plano de terreno e adicione Geometry Nodes.","Distribua pontos na superfície com densidade controlada.","Use instâncias de uma Collection de objetos para espalhar árvores/pedras.","Aplique valores aleatórios de escala e rotação.","Não use Realize Instances sem precisar; isso aumenta geometria real.","Adicione iluminação, câmera, e teste render de prévia."],"result":"Uma floresta que pode ganhar dezenas de objetos sem duplicar um por um."},{"id":"13","title":"Escadaria modular de pedra","steps":["Crie um único degrau (0,3 m altura, 0,8 m profundidade aproximada) com bevel discreto.","Use Array para repetir pelo eixo do comprimento e ajuste deslocamento vertical com Object Offset ou combinação de modifiers.","Confira degraus pela vista lateral ortográfica: a altura total precisa ser regular.","Crie corrimão separado em peças reutilizáveis.","Faça pedras com cor e desgaste ligeiramente diferentes, usando instâncias.","Teste walkable surface sem colisões entre degraus.","Renderize, salve o arquivo e compare quantidade de objetos antes e depois de instanciar."],"result":"Escadaria modular com espaçamento uniforme e peças reutilizáveis."},{"id":"14","title":"Janela de casa medieval","steps":["Modele uma parede e crie um cubo cortador da abertura da janela.","Use Boolean Difference, verificando atravessamento completo da parede.","Faça uma moldura com quatro ripas de madeira e Bevel sutil.","Modele uma única trava e repita por instância nas esquadrias.","Crie vidro separado e atribua material com transmissão ou opacidade estilizada.","Verifique normais e se a moldura não atravessa a parede.","Salve um conjunto reutilizável com pivot apropriado para outras casas."],"result":"Janela modular com abertura real e moldura pronta para duplicar."},{"id":"15","title":"Portal de pedra com arco","steps":["Monte duas colunas de pedra com cubos escalados e varie posição de algumas rochas.","Crie um arco com Curve ou sequência de blocos em rotação.","Espelhe lateral esquerda/direita usando Mirror ou duplicação ligada.","Adicione pequena plataforma de chão em pedra.","Insira textura de rocha orientada corretamente e desgaste nas quinas.","Teste composição em vista frontal e lateral para detectar interpenetrações.","Renderize portal isolado como prop de cenário."],"result":"Portal simétrico com arco estável e módulos de pedra reaproveitáveis."},{"id":"16","title":"Barraca de feira medieval","steps":["Bloqueie quatro postes e uma cobertura com inclinação.","Modele um balcão a partir de cubos e adicione suporte lateral em Mirror.","Crie lona como plano com Solidify; adicione dobras leves usando Proportional Editing.","Repita tábuas do balcão com Array.","Crie três mercadorias simples (frutas, sacos ou potes) usando instâncias.","Atribua cores de tecido, madeira e ferragens; confira contraste.","Renderize vista três-quartos e organize objetos em Collection."],"result":"Barraca reconhecível com lona, balcão e itens de cenário."},{"id":"17","title":"Poço de vila com corda","steps":["Crie anel de pedra com malha circular e extrude altura.","Repita tijolos/pedras ao redor com instâncias radiais ou Array + Empty.","Faça dois postes verticais e viga horizontal como suporte.","Adicione cilindro pequeno para carretel e curva para corda.","Crie balde low-poly com alça e material metálico ou madeira.","Configure água no interior com plano levemente abaixo da borda.","Teste escala e render em iluminação lateral."],"result":"Poço de vila com volumes reconhecíveis, corda, balde e água."},{"id":"18","title":"Bigorna e ferramentas de ferreiro","steps":["Bloqueie bigorna usando cubos e forma afunilada simples.","Faça chifre da bigorna com extrusão ou peça independente.","Crie pedestal de madeira com bevel e textura de veios verticais.","Modele martelo em apenas dois objetos: cabeça de ferro e cabo.","Duplique cabeça/haste de pequenos pregos com instâncias.","Atribua material metálico com Roughness apropriada e sinais sutis de uso.","Monte composição de oficina e renderize imagem de portfólio."],"result":"Conjunto de ferraria com escala coerente, ferro e madeira distintos."},{"id":"19","title":"Fogueira com pedras e brasas","steps":["Modele uma tora simples, aplique Bevel e distribua cópias em círculo com rotação variada.","Acrescente um anel irregular de pedras usando cinco ou seis instâncias.","Crie formas de chama estilizadas com malhas de faces, sem tentar simulação complexa.","Use material Emission laranja/vermelho e uma Point Light de baixa potência.","Adicione plano de solo e sombras suaves.","Teste a fogueira em render diurno e noturno para avaliar emissividade.","Salve o modelo sem depender de assets externos."],"result":"Fogueira estilizada iluminando uma pequena área de terreno."},{"id":"20","title":"Penhasco e trilha de montanha","steps":["Crie plano subdividido de terreno e proporções gerais por Proportional Editing.","Use Displace com textura Noise para relevo grande, preservando cópia original.","Adicione uma trilha com curva seguindo a encosta.","Crie três rochas-base com malhas diferentes e distribua instâncias ao longo do caminho.","Aplique tons de pedra e terra separados por altura e inclinação.","Observe ângulos muito abruptos e ajuste caminho para ficar visualmente transitável.","Renderize uma vista aérea e uma vista no nível do personagem."],"result":"Mini-ambiente montanhoso com composição legível e instâncias otimizadas."}]}</script>
<script>
'use strict';
const raw=JSON.parse(document.getElementById('base-data').textContent);
const ALLSHORT=raw.shortcuts, ALLMOD=raw.modifiers, PROJECTS=raw.projects;
const UNITS=[
{id:'Interface',symbol:'⌗',title:'Interface e navegação',sub:'Encontre tudo rápido e mantenha a cena organizada.',goal:'Mover-se com segurança pela Viewport e localizar qualquer comando.',workflow:['Passe o cursor sobre o editor certo: a mesma tecla muda de função conforme o contexto.','Use F3 para buscar comandos pelo nome em inglês; Q para guardar seus favoritos.','Use as vistas ortográficas e Num . para inspecionar o objeto com precisão.','Organize objetos e coleções desde o primeiro bloco.'],fast:'Em vez de procurar a operação por vários menus, pressione F3 e digite o nome. Registre os comandos frequentes em Quick Favorites (Q).',exercise:'Abra um cubo, mude entre vistas frontal, lateral e superior, foque o cubo, renomeie-o e guarde o projeto.'},
{id:'Criacao',symbol:'◈',title:'Criação e objetos',sub:'Primitivas, transformações, instâncias e coleções.',goal:'Criar formas precisas sem ajustar tudo no olho.',workflow:['Comece com uma primitiva que se pareça com a silhueta desejada.','Digite medidas nas transformações: S → X → 2, por exemplo.','Aprenda quando usar Shift + D (cópia independente) e Alt + D (malha vinculada).','Aplique escala quando o próximo operador precisar de medidas coerentes.'],fast:'Para um objeto de 2 metros de largura: use as dimensões na barra N ou transforme numericamente. Replicar peças? Prefira Array ou instâncias.',exercise:'Crie uma mesa com tampo e quatro pés, agrupe em coleção e atribua nomes a cada peça.'},
{id:'Modelagem',symbol:'⬡',title:'Modelagem de malha',sub:'Extrude, loop cut, bevel, inset, topology.',goal:'Construir malhas limpas usando poucas operações conscientes.',workflow:['No Edit Mode, alterne 1 / 2 / 3 para vértices, arestas e faces.','Use Inset (I) antes de extrudar janelas, portas e molduras.','Use Loop Cut (Ctrl + R) apenas onde for necessário controlar a forma.','Use Bevel para bordas e revise normais antes de finalizar.'],fast:'Não edite os dois lados de um personagem: trabalhe só metade da malha com Mirror + Clipping.',exercise:'Modele um baú com Inset, Extrude e Bevel mantendo peças organizadas.'},
{id:'Escultura',symbol:'✺',title:'Escultura digital',sub:'Pincéis, simetria, voxel remesh e máscaras.',goal:'Esculpir volumes sem se perder em microdetalhes cedo demais.',workflow:['Comece com formas grandes e compare a silhueta por vários ângulos.','Ative simetria X quando o modelo for simétrico.','Ajuste raio (F) e força (Shift + F), usando suavização com Shift quando disponível.','Faça detalhes por último e planeje retopologia para animação ou jogos.'],fast:'Use Voxel Remesh quando várias formas precisam virar um volume contínuo; depois revise a densidade para não perder desempenho.',exercise:'Esculpa uma criatura de três volumes: corpo, cabeça e chifres; finalize silhueta antes da pele.'},
{id:'UV',symbol:'▦',title:'UV Editing',sub:'Costuras, ilhas, unwrap e aproveitamento da textura.',goal:'Preparar superfícies para receber texturas sem deformações.',workflow:['Aplique escala e confira a malha antes do unwrap.','Marque costuras nas regiões menos visíveis.','Use U → Unwrap e examine alongamento com textura quadriculada.','Ajuste proporções entre ilhas e empacote com margem.'],fast:'Para um asset rígido simples, Smart UV Project pode adiantar o trabalho; em personagens, costuras manuais dão mais controle.',exercise:'Abra a UV de um baú e pinte faces diferentes com um teste quadriculado.'},
{id:'Pintura',symbol:'◉',title:'Pintura e texturas',sub:'Texture Paint, Vertex Paint, Weight Paint.',goal:'Pintar texturas e pesos sem perder arquivos.',workflow:['Crie uma imagem, conecte-a ao material e confirme o nó ativo.','Entre em Texture Paint e pinte áreas gerais antes de pequenos detalhes.','Use os painéis adequados para atributos de cor ou pesos de ossos.','Salve a imagem em Image → Save / Save As e também o .blend.'],fast:'O .blend não garante sozinho que uma imagem externa modificada no Texture Paint foi salva. Confira a imagem no Image Editor.',exercise:'Pinte um baú com madeira marrom, faixas metálicas e uma região de desgaste.'},
{id:'Materiais',symbol:'◌',title:'Materiais e nós',sub:'Shading, Principled BSDF e Geometry Nodes.',goal:'Dominar cor, rugosidade, metal e materiais reutilizáveis.',workflow:['Comece com Principled BSDF: Base Color, Metallic e Roughness.','Use Shift + A no Shader Editor para acrescentar Image Texture ou outros nós.','Organize materiais reutilizáveis com nomes claros.','No Geometry Nodes, use instâncias para grandes quantidades de objetos.'],fast:'A iluminação altera totalmente a aparência do material. Faça testes com uma luz e uma câmera antes de adicionar dezenas de nós.',exercise:'Crie madeira, metal fosco e metal brilhante; compare as três superfícies.'},
{id:'Rigging',symbol:'♧',title:'Rigging e pesos',sub:'Armatures, bones, hierarquia e deformação.',goal:'Criar um esqueleto que mova a malha de maneira controlável.',workflow:['Crie uma armature; no Edit Mode posicione ossos nas articulações.','Nomeie lados .L e .R antes de simetrizar o esqueleto.','Faça parent da malha à armature com Automatic Weights.','Teste em Pose Mode e corrija as regiões erradas em Weight Paint.'],fast:'Antes de animar, teste cotovelos, joelhos e ombros em poses extremas. Corrigir pesos cedo evita refazer toda a animação.',exercise:'Monte um braço com dois segmentos, ligue pesos e dobre o cotovelo.'},
{id:'Animacao',symbol:'▶',title:'Animação',sub:'Keyframes, Dope Sheet, Graph Editor, ciclos.',goal:'Transformar poses em movimentos legíveis e reutilizáveis.',workflow:['No frame 1 grave a pose inicial usando os keyframes apropriados.','Avance para outro frame e grave a segunda pose.','No Dope Sheet ajuste o tempo dos keyframes.','No Graph Editor altere interpolação, handles e loops.'],fast:'Use antecipação → ação → recuperação nas poses. Para um movimento repetitivo, considere Cycles nas F-Curves em vez de dezenas de keys.',exercise:'Anime uma bola pulando ou um bone acenando em 3 a 5 keyframes.'},
{id:'Render',symbol:'◫',title:'Render e exportação',sub:'Câmera, luzes, Eevee, Cycles, GLB.',goal:'Entregar imagens, vídeos e assets prontos para engine.',workflow:['Ajuste a câmera e a iluminação antes do render definitivo.','Para prévia, teste Eevee; quando necessário, avalie Cycles.','Configure resolução, FPS, caminho e formato de saída.','Antes do GLB, revise UV, texturas salvas, orientação, escala e animações.'],fast:'Faça um render pequeno primeiro. Para jogos, teste o arquivo exportado dentro da engine: abrir no Blender não garante que tudo exportou.',exercise:'Crie um render do seu baú e exporte o asset em .glb para uma cena de teste.'},
{id:'Extras',symbol:'✦',title:'Ferramentas extras',sub:'Organização, pesquisa, diagnóstico e ajustes.',goal:'Encontrar problemas antes que eles virem retrabalho.',workflow:['Use F3 para localizar comandos raros.','Inspecione normals, escala e topologia quando a malha se comportar de modo estranho.','Isole o objeto ou a parte trabalhada.','Use coleções e nomes para não perder objetos durante projetos grandes.'],fast:'Travou? Descubra primeiro se está no modo correto (Object/Edit/Pose/Sculpt) e com o mouse sobre o editor certo.',exercise:'Crie uma cena com dez peças, organize-as em coleções e encontre problemas deliberadamente.'}];
const GROUPS=[['all','Todos'],['EDIT','Dados'],['GENERATE','Gerar'],['DEFORM','Deformar'],['NORMALS','Normais'],['PHYSICS','Física'],['GP','Grease Pencil'],['F-CURVE','F-Curve'],['SEQUENCER','Vídeo/Áudio']];
const labs=[{id:'array',name:'Array',short:'1 modelo → muitas cópias',why:'Repete peças usando a quantidade e a distância configuradas. Ideal para cercas, grades, escadas e fachadas.',steps:['Modele uma estaca e ajuste seu tamanho.','Abra Properties → Modifiers → Add Modifier → Array.','Ajuste Count e Offset, observando a distância entre instâncias.','Mantenha o modificador editável até decidir o tamanho final.'],warning:'A contagem e o offset dependem do tipo/versão do Array; confira qual implementação está usando.'},{id:'mirror',name:'Mirror',short:'Metade feita, outra refletida',why:'Cria a geometria espelhada sem exigir que você modele os dois lados.',steps:['No Edit Mode, deixe só a metade da malha que pretende editar.','Posicione a origem do objeto no eixo de simetria.','Adicione Mirror, escolhendo X, Y ou Z.','Ative Merge e, quando necessário, Clipping.'],warning:'Espelho usa a origem e os eixos do objeto; mover a origem pode mudar tudo.'},{id:'bevel',name:'Bevel',short:'Bordas mais naturais',why:'Cria chanfros e arredondamentos para que a luz destaque as quinas.',steps:['Modele um bloco simples.','Abra Modifiers → Bevel.','Ajuste Amount e Segments.','Teste Hardening Normals/ajustes de sombreamento conforme o material.'],warning:'Bordas muito próximas podem causar sobreposições; revise a escala do objeto.'},{id:'boolean',name:'Boolean',short:'Corte e perfurações',why:'Subtrai, une ou intersecta duas geometrias para abrir janelas, portas e encaixes.',steps:['Modele o objeto principal e um objeto cortador.','No principal, adicione Boolean → Difference.','Defina o cortador e veja o furo resultante.','Revise a topologia depois de confirmar o corte.'],warning:'Topologia complicada pode surgir perto do furo; use este método com atenção em malhas deformáveis.'},{id:'solidify',name:'Solidify',short:'Parede deixa de ser folha',why:'Adiciona espessura a superfícies finas como roupas, painéis e paredes.',steps:['Crie uma face ou malha de espessura zero.','Adicione Solidify.','Ajuste Thickness e Offset.','Confira faces internas e possíveis interseções.'],warning:'Espessura excessiva em curvas fechadas pode causar colisões de superfície.'},{id:'subsurf',name:'Subdivision Surface',short:'Uma malha, mais suavidade',why:'Refina a malha e suaviza a silhueta, sem obrigar você a esculpir cada detalhe.',steps:['Comece com uma malha simples.','Adicione Subdivision Surface e aumente o nível de visualização.','Use loops de suporte para preservar cantos.','Controle a densidade para não pesar o arquivo.'],warning:'Não é um substituto para boa topologia nem para retopologia de personagens.'}];
const QUESTIONS=[{q:'Você vai criar 40 estacas alinhadas. O melhor primeiro teste é…',answers:['Duplicar 39 vezes com Shift + D','Usar Array com espaçamento configurado','Esculpir as estacas uma a uma'],a:1,why:'O Array repete elementos de forma parametrizada e reduz o retrabalho.'},{q:'Qual é a vantagem do Mirror?',answers:['Reduzir a iluminação da cena','Refletir automaticamente a outra metade da malha','Transformar textura em vídeo'],a:1,why:'O Mirror mantém um lado sincronizado com o outro.'},{q:'Você terminou de pintar uma imagem no Texture Paint. O que conferir?',answers:['Somente Ctrl + S no .blend','Se a textura/imagem foi salva','Se há um array na malha'],a:1,why:'Imagens externas editadas precisam ser salvas explicitamente.'},{q:'Que tecla normalmente pesquisa operações pelo nome?',answers:['F3','F12','Alt + P'],a:0,why:'F3 abre a busca de operadores, útil quando você esquece menus.'},{q:'Para criar uma face com uma moldura interna em Edit Mode, use…',answers:['Inset (I)','Render (F12)','Escala (S)'],a:0,why:'Inset cria uma face interna com borda.'},{q:'No processo de animação, onde você refina curvas e acelerações?',answers:['Texture Paint','Graph Editor','UV Editor'],a:1,why:'No Graph Editor, você altera interpolação e tangentes das F-Curves.'},{q:'Por que retopologia é importante para um personagem esculpido?',answers:['Aumenta a qualidade da pintura sem UV','Cria uma malha adequada à deformação e ao desempenho','Substitui a armature'],a:1,why:'Esculturas muito densas nem sempre deformam bem ou rodam bem em jogos.'},{q:'Qual recurso adiciona espessura a uma superfície sem volume?',answers:['Solidify','Mirror','Decimate'],a:0,why:'Solidify cria casca/espessura controlável.'}];
const STORAGE_KEY='blender-atlas-progress-v2';
let state={page:'inicio',filter:'all',modFilter:'all',search:'',modSearch:'',favOnly:false,favorites:[],done:[],unitsDone:[],projectSteps:{},openProj:'01',lab:'array',labAmount:6,quiz:{}};
try{const old=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');Object.assign(state,old);state.page='inicio';state.search='';state.modSearch='';}catch(e){}
const qs=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const plain=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const save=()=>{try{let p={...state,page:'inicio',search:'',modSearch:''};localStorage.setItem(STORAGE_KEY,JSON.stringify(p))}catch(e){}};
let doneCount=()=>state.unitsDone.length+Object.values(state.projectSteps||{}).reduce((a,b)=>a+Object.values(b||{}).filter(Boolean).length,0);
let totalActivities=()=>UNITS.length+PROJECTS.reduce((a,p)=>a+p.steps.length,0);
const iconFor=k=>UNITS.find(u=>u.id===k)?.symbol||'◇';
const unitPage=p=>p.startsWith('unit:')?p.slice(5):null;
function toast(msg){let el=qs('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function nav(){let m=[['inicio','⌂','Visão geral'],['trilha','◫','Trilha completa'],['atalhos','⌨','Todos os atalhos'],['modificadores','⬡','Catálogo de modifiers'],['laboratorio','◈','Laboratório visual'],['projetos','▣',`${PROJECTS.length} desafios práticos`],['quiz','?','Teste seus conhecimentos'],['config','⚙','Progresso e opções']];qs('navMain').innerHTML=m.map(([id,ic,title])=>`<button class="nav-item ${state.page===id?'active':''}" data-go="${id}"><span class="num">${ic}</span>${title}</button>`).join('');qs('navUnits').innerHTML=UNITS.map((u,i)=>`<button class="nav-item ${state.page==='unit:'+u.id?'active':''}" data-go="unit:${u.id}"><span class="num">${String(i+1).padStart(2,'0')}</span>${esc(u.title)}${state.unitsDone.includes(u.id)?' <span style="margin-left:auto;color:#6ed8ae">✓</span>':''}</button>`).join('');qs('sidebar-count').textContent=doneCount();qs('sidebar-progress').style.width=(doneCount()/totalActivities()*100).toFixed(1)+'%';}
function go(page){state.page=page;state.search='';qs('globalSearch').value='';render();window.scrollTo({top:0,behavior:'instant'});qs('sidebar').classList.remove('open');qs('overlay').classList.remove('open')}
function wrap(body){return body+`<footer class="footer">BLENDER ATLAS • Livro interativo independente • Conteúdo baseado no Atlas 5.2 LTS e ampliado com exemplos didáticos.<br>Os diagramas são esquemáticos, não capturas reais da interface. Atalhos e ferramentas variam conforme o modo, o keymap e a versão.</footer>`}
function render(){nav();const labels={inicio:'Visão geral',trilha:'Trilha completa',atalhos:'Atalhos',modificadores:'Modificadores',laboratorio:'Laboratório visual',projetos:'Projetos práticos',quiz:'Questionário',config:'Opções'};qs('breadcrumb').textContent='ATLAS / '+(unitPage(state.page)||labels[state.page]||'BUSCA').toUpperCase();let html='';if(state.page==='inicio')html=home();else if(state.page==='trilha')html=trail();else if(state.page==='atalhos')html=shortcutsPage();else if(state.page==='modificadores')html=modifierPage();else if(state.page==='laboratorio')html=labPage();else if(state.page==='projetos')html=projectPage();else if(state.page==='quiz')html=quizPage();else if(state.page==='config')html=settingsPage();else if(state.page==='busca')html=globalResults();else if(unitPage(state.page))html=unitSection(unitPage(state.page));else html=home();qs('content').innerHTML=wrap(html)}
function heroSvg(){return `<svg viewBox="0 0 470 360" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Ilustração esquemática de objetos 3D"><defs><linearGradient id="s1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffa35d"/><stop offset="1" stop-color="#f27127"/></linearGradient><linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#75d5f5"/><stop offset="1" stop-color="#1c73af"/></linearGradient><linearGradient id="s3" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#415f83"/><stop offset="1" stop-color="#183657"/></linearGradient></defs><path d="M27 285L230 183 440 283 239 359Z" stroke="#4081a8" stroke-opacity=".42"/><path d="M75 260L262 167 417 259" stroke="#3a7b9f" stroke-opacity=".32"/><path d="M110 300L300 204M167 325L355 233" stroke="#4789af" stroke-opacity=".4"/><ellipse cx="239" cy="284" rx="130" ry="35" fill="#00182f" opacity=".35"/><path d="M169 135L253 94 335 135 254 176Z" fill="#92ddf5"/><path d="M169 135V222L254 266V176Z" fill="url(#s2)"/><path d="M254 176L335 135V222L254 266Z" fill="#0b588b"/><path d="M171 136L254 176 334 136" stroke="#c4efff" stroke-width="3"/><path d="M254 176V267" stroke="#5dc8f4" stroke-opacity=".75" stroke-width="3"/><path d="M186 153L186 218M199 160L199 224M212 165L212 233" stroke="#a4e7ff" stroke-opacity=".25"/><path d="M244 84L254 27 264 84 293 111 254 134 214 111Z" fill="url(#s1)"/><path d="M244 84L254 134V27" stroke="#ffd1a0" stroke-width="2"/><path d="M293 111L254 134 214 111" stroke="#ffc493" stroke-width="1"/><path d="M336 189L386 165 416 180 366 205Z" fill="#b2d6ef"/><path d="M336 189V235L366 250V205Z" fill="#3d7195"/><path d="M366 205L416 180V227L366 250Z" fill="#194b78"/><path d="M93 206L141 180 175 197 126 223Z" fill="#ffd8a2"/><path d="M93 206V255L126 273V223Z" fill="#f79340"/><path d="M126 223L175 197V247L126 273Z" fill="#be5b23"/><circle cx="365" cy="125" r="8" stroke="#fda15b" stroke-width="2"/><circle cx="104" cy="128" r="5" fill="#5daed0"/><path d="M107 128H154M365 133V155M351 115L339 105" stroke="#8dbcd4" stroke-dasharray="4 5"/><rect x="30" y="36" width="100" height="33" rx="8" fill="#254e6a" stroke="#3c7495"/><text x="45" y="57" fill="#9dcde8" font-size="11" font-family="Arial">MESH.001</text><rect x="336" y="48" width="114" height="33" rx="8" fill="#254e6a" stroke="#3c7495"/><text x="347" y="69" fill="#ffb977" font-size="11" font-family="Arial">MODIFIER ⬡</text></svg>`}
function home(){return `<div class="hero"><div class="hero-copy"><div class="eyebrow">VOLUME 2 • GUIA PRÁTICO INTERATIVO</div><h1>Aprenda o Blender<br><em>sem fazer tudo</em><br>do jeito difícil.</h1><p>Atalhos pesquisáveis, modificadores explicados, demonstrações visuais e ${PROJECTS.length} projetos reais. Da primeira malha à animação — tudo em um arquivo que funciona offline.</p><div class="hero-actions"><button class="btn orange" data-go="trilha">Começar a estudar →</button><button class="btn ghost" data-go="laboratorio">Testar modificadores ◈</button></div></div><div class="hero-visual">${heroSvg()}</div></div>
<div class="metric-grid"><div class="metric"><strong>${ALLSHORT.length}</strong><span>atalhos pesquisáveis</span></div><div class="metric"><strong>${ALLMOD.length}</strong><span>modificadores explicados</span></div><div class="metric"><strong>${UNITS.length}</strong><span>áreas de produção</span></div><div class="metric"><strong>${PROJECTS.length}</strong><span>projetos passo a passo</span></div></div>
<div class="two-col"><div class="stack"><div class="card"><div class="section-head"><div><div class="eyebrow">O seu ponto de partida</div><h2>Como estudar com este atlas</h2></div></div><div class="feature-row"><div class="feature-ico">⌨</div><div><h4>Esqueceu uma tecla?</h4><p>Busque pelo nome do comando, pelo atalho ou pela área. Cada item mostra quando utilizar e em qual modo.</p></div></div><div class="feature-row"><div class="feature-ico">◈</div><div><h4>Não sabe qual modificador escolher?</h4><p>Explore o catálogo ou mexa nos controles do laboratório visual para entender a transformação da geometria.</p></div></div><div class="feature-row"><div class="feature-ico">◫</div><div><h4>Aprenda criando objetos</h4><p>Pratique em ${PROJECTS.length} projetos com tarefas marcáveis. Seu progresso fica salvo neste navegador, quando o armazenamento local está disponível.</p></div></div><div style="margin-top:18px"><button class="btn dark" data-go="projetos">Abrir projetos guiados →</button></div></div>
<div class="card"><div class="eyebrow">Fluxo de trabalho real</div><h3 style="margin-top:10px">Da ideia ao produto final</h3>${['Criação → medidas e silhueta','Modelagem → forma e topologia','Escultura → volume e detalhes','UV → abrir a superfície','Pintura → texturas e pesos','Materiais → aparência física','Rigging → ossos e influência','Animação → poses e movimento','Render / exportação → entrega'].map((x,i)=>`<div style="display:flex;gap:10px;align-items:center;margin:11px 0"><span class="pill ${i===0?'warm':''}">${String(i+1).padStart(2,'0')}</span><span style="font-size:12px;color:#476477">${x}</span></div>`).join('')}<button class="btn outline" data-go="trilha" style="margin-top:10px">Ver a trilha completa ↗</button></div></div>
<div class="card" style="margin-top:18px"><div class="section-head"><div><div class="eyebrow">Uma lição importante</div><h2>Os 4 hábitos que economizam mais tempo</h2></div></div><div class="three-col" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${[['01','Pense na repetição','Array, instâncias e Geometry Nodes substituem cópias manuais.'],['02','Busque a simetria','Mirror reduz pela metade o trabalho em muitos personagens e armas.'],['03','Evite destruir cedo','Mantenha os modifiers na pilha enquanto ainda estiver decidindo.'],['04','Planeje a entrega','UV, materiais, rigging e exportação dependem das escolhas da modelagem.']].map(([n,t,d])=>`<div style="background:#f5f9fc;padding:15px;border-radius:11px"><span class="pill warm">${n}</span><h4 style="margin:10px 0 3px">${t}</h4><p style="font-size:11px;margin:0">${d}</p></div>`).join('')}</div></div>`}
function trail(){return `<div class="section-head"><div><div class="eyebrow">Roteiro completo</div><h1>Trilha de aprendizado</h1><p>Estude na ordem ou entre diretamente no modo que estiver usando agora. Cada capítulo traz atalhos, um fluxo eficiente e uma atividade.</p></div><span class="pill green">${state.unitsDone.length} / ${UNITS.length} módulos concluídos</span></div><div class="chapter-grid">${UNITS.map((u,i)=>`<button class="chapter-card ${state.unitsDone.includes(u.id)?'done':''}" data-go="unit:${u.id}"><div><span class="pill ${i%3===0?'warm':''}">MÓDULO ${String(i+1).padStart(2,'0')}</span><h3>${esc(u.title)}</h3><p>${esc(u.sub)}</p></div><div class="circle">${state.unitsDone.includes(u.id)?'✓':u.symbol}</div></button>`).join('')}</div><div class="notice" style="margin-top:18px"><strong>Dica para aprender de verdade</strong>Use o Blender ao lado da apostila. Leia um comando, execute no programa e refaça sem consultar. Evite memorizar atalhos sem um objetivo.</div>`}
function keyPieces(s){return s.split(/\s+\+\s+/).map(x=>`<span class="key">${esc(x)}</span>`).join('<span style="color:#b1c0cc"> + </span>')}
function makeTable(data,max=999){let rows=data.slice(0,max);return rows.length?`<div class="card p0 table-scroll"><table class="shortcut-table"><thead><tr><th>Ferramenta / ação</th><th>Atalho ou caminho</th><th>Quando usar</th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>${esc(s.action)}</b><br><span class="tiny muted">${esc(s.area)} · p. ${s.page}</span></td><td style="min-width:145px">${keyPieces(s.key)}</td><td>${esc(s.desc||'Consulte o operador no Blender pelo F3 para confirmar o contexto.')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nenhum atalho encontrado. Tente outra palavra ou outro módulo.</div>`}
function shortcutsPage(){let areas=['all',...UNITS.map(u=>u.id)];let data=ALLSHORT.filter(s=>(state.filter==='all'||s.area===state.filter)&&(!state.search||plain(s.action+' '+s.key+' '+s.desc).includes(plain(state.search))));return `<div class="section-head"><div><div class="eyebrow">Consulta rápida</div><h1>Biblioteca de atalhos</h1><p>Comandos extraídos da apostila anterior e reorganizados por contexto. Teclas podem mudar conforme o editor, modo e keymap.</p></div><span class="pill">${data.length} encontrados</span></div><div class="toolbar"><input class="input grow" id="shortcutSearch" placeholder="Ex.: extrude, bevel, shift, animar…" value="${esc(state.search)}"/><button class="btn outline small" data-clear-search="1">Limpar</button></div><div class="chipbar" style="margin-bottom:17px">${areas.map(a=>`<button class="chip ${state.filter===a?'active':''}" data-short-filter="${a}">${a==='all'?'Todos':esc(a)}</button>`).join('')}</div><div id="shortcutResults">${makeTable(data)}</div>`}
function modCards(data){return data.length?`<div class="catalog">${data.map(m=>`<article class="mod-card"><div class="mod-head"><div><span class="pill ${m.essential?'warm':''}">${esc(m.group)}</span>${m.essential?'<span class="pill green" style="margin-left:5px">ESSENCIAL</span>':''}<h3 style="margin-top:9px">${esc(m.name)}</h3></div><button class="fav ${state.favorites.includes(m.group+':'+m.name)?'active':''}" data-fav="${esc(m.group+':'+m.name)}" title="Salvar como favorito">${state.favorites.includes(m.group+':'+m.name)?'★':'☆'}</button></div><p>${esc(m.desc)}</p><div class="mod-line"><b>✓ USE QUANDO:</b> ${esc(m.use)}</div><div class="mod-line"><b>! ATENÇÃO:</b> ${esc(m.caution)}</div><div class="source">Fonte: atlas anterior, página ${m.page}</div></article>`).join('')}</div>`:`<div class="empty">Nenhum modifier para esta pesquisa. Remova filtros e tente outro termo.</div>`}
function modList(){let data=ALLMOD.filter(m=>(state.modFilter==='all'||m.group===state.modFilter)&&(!state.favOnly||state.favorites.includes(m.group+':'+m.name))&&(!state.modSearch||plain(m.name+' '+m.desc+' '+m.use+' '+m.caution).includes(plain(state.modSearch))));return {data,html:modCards(data)}}
function modifierPage(){let r=modList();return `<div class="section-head"><div><div class="eyebrow">Catálogo de referência</div><h1>Modificadores do Blender</h1><p>Para que servem, quando utilizar e quais problemas evitar. Inclui modifiers de objetos, Grease Pencil, F-Curves e Video Sequencer.</p></div><button class="btn orange no-print" data-go="laboratorio">Ver na prática ◈</button></div><div class="toolbar"><input class="input grow" id="modifierSearch" placeholder="Buscar modifier, efeito ou uso…" value="${esc(state.modSearch)}"/><button class="btn outline small" data-fav-only="1">${state.favOnly?'★ Só favoritos':'☆ Ver favoritos'}</button></div><div class="chipbar" style="margin-bottom:13px">${GROUPS.map(([k,v])=>`<button class="chip ${state.modFilter===k?'active':''}" data-mod-filter="${k}">${v}</button>`).join('')}</div><div class="statline" id="modifierStat" style="margin-bottom:11px">${r.data.length} modificadores listados</div><div id="modifierResults">${r.html}</div>`}
function unitSection(id){let u=UNITS.find(x=>x.id===id);if(!u)return home();let sc=ALLSHORT.filter(x=>x.area===id);return `<div class="unit-hero"><div><div class="eyebrow">MÓDULO ${String(UNITS.findIndex(x=>x.id===id)+1).padStart(2,'0')}</div><h1>${esc(u.title)}</h1><p>${esc(u.goal)}</p></div><div class="unit-icon">${u.symbol}</div></div><div class="two-col"><div class="stack"><div class="card"><div class="eyebrow">01 · Sequência eficiente</div><h2 style="margin-top:10px">Como trabalhar nesta área</h2><ol class="step-list">${u.workflow.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div><div><div class="section-head"><div><div class="eyebrow">02 · Consulta por modo</div><h2>${sc.length} atalhos deste módulo</h2></div></div>${makeTable(sc)}</div></div><div class="stack"><div class="card"><span class="pill warm">MÉTODO RÁPIDO</span><h3 style="margin:11px 0 7px">Evite trabalho desnecessário</h3><p style="font-size:12px">${esc(u.fast)}</p></div><div class="card"><span class="pill green">DESAFIO PRÁTICO</span><h3 style="margin:11px 0 7px">Faça agora no Blender</h3><p style="font-size:12px">${esc(u.exercise)}</p><button class="btn ${state.unitsDone.includes(id)?'outline':'orange'}" style="width:100%;margin-top:8px" data-complete-unit="${id}">${state.unitsDone.includes(id)?'✓ Concluído • Desmarcar':'Marcar módulo concluído ✓'}</button></div><div class="card"><span class="pill">NAVEGAÇÃO</span><p style="margin:10px 0;font-size:12px">Conheça as ferramentas visuais e experimente os projetos de produção.</p><button class="btn outline" data-go="laboratorio">Abrir laboratório ◈</button><br><button class="btn outline" data-go="projetos" style="margin-top:7px">Ver projetos →</button></div></div></div>`}
function previewSVG(id,v){const start=`<svg viewBox="0 0 520 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama esquemático do modificador ${esc(id)}"><defs><linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffbc70"/><stop offset="1" stop-color="#ed752e"/></linearGradient><linearGradient id="left" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#58b8eb"/><stop offset="1" stop-color="#0e70ad"/></linearGradient><linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2c84b4"/><stop offset="1" stop-color="#155076"/></linearGradient></defs><g opacity=".28" stroke="#7ca7c5" stroke-width="1"><path d="M45 237H475M75 214H445M105 191H415M135 168H385M165 145H355"/><path d="M40 235L265 112 480 235M98 238L295 128M155 239L326 143M215 242L356 163M275 246L387 187M338 249L414 205"/></g>`;
function cube(x,y,w,h,op=1){let d=Math.min(20,w*.22);return `<g opacity="${op}"><path d="M${x} ${y}l${d} -${d*.6}h${w}l-${d} ${d*.6}z" fill="url(#top)"/><path d="M${x} ${y}h${w}v${h}h-${w}z" fill="url(#left)"/><path d="M${x+w} ${y}l${d} -${d*.6}v${h}l-${d} ${d*.6}z" fill="url(#right)" stroke="#72c6e5" stroke-width="1"/></g>`}
let f='';if(id==='array'){let n=+v,space=n>8?38:48;let w=22;let startX=260-(n-1)*space/2;for(let i=0;i<n;i++)f+=cube(startX+i*space,140,24,73,i===0?1:.83);f+=`<text x="260" y="42" fill="#d5e8f4" text-anchor="middle" font-size="13">COUNT = ${n}</text><text x="260" y="255" fill="#91b3ca" text-anchor="middle" font-size="10">Altere o número de instâncias</text>`}
else if(id==='mirror'){f+=`<path d="M260 45V240" stroke="#f8a15d" stroke-width="2" stroke-dasharray="5 6"/><text x="276" y="56" fill="#f8ae72" font-size="11">EIXO X</text>`;f+=cube(160,113,72,103,1);if(v>0)f+=`<g transform="translate(520 0) scale(-1 1)" opacity=".75">${cube(160,113,72,103)}</g>`;f+=`<text x="260" y="252" text-anchor="middle" fill="#a4c6db" font-size="11">${v>0?'Metade espelhada em tempo real':'Espelhamento desativado'}</text>`}
else if(id==='bevel'){let r=+v,rad=4+r*3;f+=`<g transform="translate(149 45)"><rect x="0" y="50" width="220" height="145" rx="${rad}" fill="url(#left)" stroke="#a3d8ed" stroke-width="3"/><path d="M0 50L32 28H255L220 50" fill="url(#top)"/><path d="M220 50L255 28V165L220 195" fill="url(#right)"/><path d="M0 50Q${rad*2} ${rad*1.6} ${rad} 50" fill="none" stroke="#ffb66a" stroke-width="5"/></g><text x="260" y="255" text-anchor="middle" fill="#a4c6db" font-size="11">Raio estilizado = ${r}</text>`}
else if(id==='boolean'){let r=+v*3+18;f+=cube(125,95,230,125);f+=`<defs><mask id="cut"><rect width="520" height="270" fill="white"/><circle cx="259" cy="156" r="${r}" fill="black"/></mask></defs><rect x="125" y="95" width="230" height="125" fill="url(#left)" mask="url(#cut)"/><circle cx="259" cy="156" r="${r}" stroke="#ffb060" stroke-width="5" fill="#08243e"/><circle cx="259" cy="156" r="${r+14}" stroke="#ffb060" stroke-opacity=".36" stroke-dasharray="5 5" fill="none"/><text x="260" y="251" text-anchor="middle" fill="#b3ccdd" font-size="11">Difference — furo subtraído</text>`}
else if(id==='solidify'){let thick=+v*3+6;f+=`<path d="M130 100L240 38 394 120 283 181Z" fill="url(#top)" stroke="#ffd09c" stroke-width="2"/><path d="M130 100L283 181V${181+thick}L130 ${100+thick}Z" fill="url(#left)"/><path d="M283 181L394 120V${120+thick}L283 ${181+thick}Z" fill="url(#right)"/><path d="M130 100L283 181 394 120" stroke="#e8bb8a" stroke-width="1.5" fill="none"/><text x="260" y="255" text-anchor="middle" fill="#b3ccdd" font-size="11">Espessura visual = ${v}</text>`}
else if(id==='subsurf'){if(v===0)f+=cube(158,86,182,125);else f+=`<ellipse cx="264" cy="153" rx="111" ry="92" fill="url(#left)" stroke="#a1dcf5" stroke-width="2"/><ellipse cx="231" cy="119" rx="38" ry="22" fill="#b9edff" opacity=".2"/><ellipse cx="265" cy="153" rx="111" ry="92" fill="none" stroke="#ffffff" stroke-opacity=".15" stroke-dasharray="6 9"/>`;f+=`<text x="260" y="257" text-anchor="middle" fill="#b3ccdd" font-size="11">${v>0?'Níveis de subdivisão aplicados na prévia':'Malha base sem subdivisão'}</text>`}return start+f+'</svg>'}
function labPage(){let l=labs.find(x=>x.id===state.lab)||labs[0],val=state.labAmount;let valueLabel=state.lab==='array'?val+' instâncias':(['mirror','subsurf'].includes(state.lab)?(val?'Ativo':'Desligado'):val+' / 10');let max=state.lab==='array'?12:['mirror','subsurf'].includes(state.lab)?1:10,min=state.lab==='array'?2:0;return `<div class="section-head"><div><div class="eyebrow">Explore antes de abrir o Blender</div><h1>Laboratório de modifiers</h1><p>Controle parâmetros e veja a ideia geométrica por trás de cada ferramenta. Estas visualizações são esquemas didáticos, não um motor Blender real.</p></div></div><div class="lab-selector">${labs.map(x=>`<button data-lab="${x.id}" class="${state.lab===x.id?'active':''}">${x.name}</button>`).join('')}</div><div class="lab"><div class="lab-screen"><div class="lab-toolbar"><span>● &nbsp; Viewport · exemplo esquemático</span><span>MODIFIERS / <b>${l.name.toUpperCase()}</b></span></div><div class="drawing" id="labDrawing">${previewSVG(l.id,val)}</div></div><div class="lab-options"><div class="lab-tag">DEMONSTRAÇÃO INTERATIVA</div><div class="lab-title">${l.name}</div><p style="font-size:12px">${l.short}</p><label for="labRange">${l.id==='array'?'Quantidade':(['mirror','subsurf'].includes(l.id)?'Efeito ligado/desligado':'Intensidade ilustrativa')} <span id="labValue" style="float:right;color:#e57a2a">${valueLabel}</span></label><input id="labRange" class="range" type="range" min="${min}" max="${max}" value="${val>max?max:val}" step="1"><div class="lab-hint"><strong>Para que serve:</strong> ${l.why}</div><div class="notice" style="margin-top:15px;padding:11px"><strong>Atenção</strong>${l.warning}</div></div></div><div class="two-col" style="margin-top:20px"><div class="card"><div class="eyebrow">Faça dentro do Blender</div><h2 style="margin:11px 0 18px">${l.name} em 4 passos</h2><ol class="step-list">${l.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div><div class="card"><div class="eyebrow">Antes → depois</div><h3 style="margin-top:12px">Trabalho manual vs. procedimento</h3><div class="mock-ui" style="margin:14px 0"><div class="mock-top"><span>Blender</span><span>Modeling</span><span>Modifiers</span></div><div class="mock-body"><div class="mock-viewport"><svg viewBox="0 0 170 125"><path d="M37 43l44-25 48 27-44 26z" fill="#ffc67e"/><path d="M37 43v46l48 25V71" fill="#207bb2"/><path d="M85 71l44-26v46l-44 23" fill="#185986"/><path d="M37 43L85 71 129 45" fill="none" stroke="#bceaff" stroke-width="1.5"/></svg></div><div class="mock-right"><b>🔧 ${l.name}</b><div class="mock-prop"><span>Viewport</span><div></div><span>Parameters</span><div style="width:75%"></div><div style="width:48%;background:#e88643"></div></div></div></div></div><p class="tiny">Local típico: selecione um objeto → Properties → aba Modifiers → Add Modifier. Os nomes e controles específicos podem variar com o tipo de objeto e a versão.</p><button class="btn outline" data-go="modificadores">Consultar todos os modifiers →</button></div></div>`}
function projectPage(){return `<div class="section-head"><div><div class="eyebrow">Pratique com propósito</div><h1>${PROJECTS.length} desafios práticos</h1><p>20 desafios práticos para você executar no Blender, com tarefas marcáveis, objetivos e resultado esperado.</p></div><span class="pill green">${PROJECTS.reduce((s,p)=>s+(p.steps.every((_,i)=>state.projectSteps?.[p.id]?.[i])?1:0),0)} de ${PROJECTS.length} completos</span></div><div class="practices">${PROJECTS.map((p,i)=>{let count=p.steps.filter((_,i)=>state.projectSteps?.[p.id]?.[i]).length,open=state.openProj===p.id;return `<article class="proj-card ${open?'open':''}"><div class="proj-top"><div class="proj-head" data-open-proj="${p.id}"><span class="pill ${count===p.steps.length?'green':i<4?'warm':''}">PROJETO ${p.id} ${count===p.steps.length?'• CONCLUÍDO':''}</span><h3>${esc(p.title)}</h3><p>${count} de ${p.steps.length} etapas feitas</p></div><button class="btn outline small" data-open-proj="${p.id}">${open?'Fechar ↑':'Abrir ↓'}</button></div><div class="proj-detail"><div class="progress-bar" style="margin-bottom:15px;background:#e3ecf0"><div class="progress-fill" style="width:${(count/p.steps.length*100).toFixed(1)}%"></div></div>${p.steps.map((s,j)=>`<label class="checkline ${state.projectSteps?.[p.id]?.[j]?'checked':''}"><input type="checkbox" data-check-proj="${p.id}:${j}" ${state.projectSteps?.[p.id]?.[j]?'checked':''}><span><b style="margin-right:7px;color:#1b688d">${String(j+1).padStart(2,'0')}</b>${esc(s)}</span></label>`).join('')}<div class="result"><strong>RESULTADO ESPERADO · </strong>${esc(p.result)}</div><div style="margin-top:13px;display:flex;gap:9px;flex-wrap:wrap"><button class="btn outline small" data-project-reset="${p.id}">Zerar etapas</button><button class="btn outline small" data-go="atalhos">Consultar atalhos ↗</button></div></div></article>`}).join('')}</div>`}
function quizPage(){const n=Object.keys(state.quiz).length;let score=Object.entries(state.quiz).filter(([i,a])=>QUESTIONS[+i].a===a).length;return `<div class="section-head"><div><div class="eyebrow">Revise seu conhecimento</div><h1>Teste rápido</h1><p>Oito situações comuns que mostram se você já está escolhendo ferramentas mais eficientes.</p></div><span class="pill">${n} / ${QUESTIONS.length} respondidas</span></div>${n===QUESTIONS.length?`<div class="card" style="margin-bottom:20px;background:#e6f7f0"><div class="eyebrow">Resultado atual</div><div class="score">${score} / ${QUESTIONS.length}</div><p>${score>=6?'Ótimo! Você já conhece os princípios. Agora leve isso para projetos reais.':'Releia as explicações e teste os modifiers antes de responder novamente.'}</p><button class="btn dark small" data-reset-quiz="1">Recomeçar teste</button></div>`:''}<div class="stack">${QUESTIONS.map((q,i)=>`<div class="card"><span class="pill">QUESTÃO ${String(i+1).padStart(2,'0')}</span><div class="quiz-question">${esc(q.q)}</div>${q.answers.map((a,j)=>`<button class="answer ${state.quiz[i]===j?'picked':''} ${state.quiz[i]!==undefined&&j===q.a?'correct':''} ${state.quiz[i]===j&&j!==q.a?'wrong':''}" data-quiz="${i}:${j}">${String.fromCharCode(65+j)}. ${esc(a)}</button>`).join('')}${state.quiz[i]!==undefined?`<div class="result" style="${state.quiz[i]===q.a?'':'background:#fff6eb;border-color:#f2e3ca;color:#8a603c'}"><b>${state.quiz[i]===q.a?'✓ Correto!':'Veja por quê:'}</b> ${esc(q.why)}</div>`:''}</div>`).join('')}</div>`}
function globalResults(){let q=state.search;if(!q)return home();let a=ALLSHORT.filter(x=>plain(x.action+' '+x.key+' '+x.desc).includes(plain(q))),m=ALLMOD.filter(x=>plain(x.name+' '+x.desc+' '+x.use).includes(plain(q)));return `<div class="section-head"><div><div class="eyebrow">Busca geral</div><h1>Resultados para “${esc(q)}”</h1><p>${a.length} atalhos e ${m.length} modificadores correspondem à pesquisa.</p></div></div><div class="section-head"><h2>Atalhos</h2><button class="btn outline small" data-go="atalhos">Ver biblioteca →</button></div>${makeTable(a,30)}<div class="section-head" style="margin-top:27px"><h2>Modificadores</h2><button class="btn outline small" data-go="modificadores">Ver catálogo →</button></div>${modCards(m.slice(0,16))}`}
